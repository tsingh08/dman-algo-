name: CI — syntax and data checks

# Catches a broken dman_algo.py BEFORE it takes down all scheduled trading jobs.
# Data-cache commits use [skip ci] so this only runs on real code changes.
on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Syntax check
        id: syntax
        run: python -m py_compile dman_algo.py

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Import check (catches module-level NameErrors, bad constants)
        id: imports
        env:
          PYTHONIOENCODING: utf-8
        run: python -c "import dman_algo; print('dman_algo imports cleanly')"

      - name: Static check — undefined names inside functions
        id: names
        # The import check above only catches NAMES EVALUATED AT IMPORT.
        # A NameError inside a function body only fires when that line runs,
        # and if the line sits in a try/except it never surfaces at all.
        # Found 2026-09-13: an undefined AssetClass had silently switched
        # PORTFOLIO_HEAT_LIMIT off (the NameError was swallowed every scan),
        # and an undefined size_strangle_trade killed every strangle advisory.
        # pyflakes reads every line without running it, so both would have
        # failed this build the day they were introduced.
        run: |
          pip install pyflakes >/dev/null
          OUT=$(python -m pyflakes dman_algo.py dman_daemon.py 2>&1 | grep -E "undefined name|is used before assignment" || true)
          if [ -n "$OUT" ]; then
            echo "$OUT"
            echo "::error::undefined names found — these are latent NameErrors"
            exit 1
          fi
          echo "no undefined names"

      - name: Golden characterization harnesses (order + exit logic)
        id: golden
        # Replays the order function and the options exit logic through fixed,
        # hermetic scenarios and compares every order, Telegram message,
        # tracker write and printed line to a committed baseline. Built for the
        # 2026-09-14 refactor of the two most complex money paths. A DIFF here
        # means behaviour changed: if that was intended, re-record with
        #   python golden/<harness>.py record
        # and commit the new .golden.json alongside the change.
        run: |
          python golden/submit_signals_harness.py check | tee /tmp/g1.txt
          python golden/monitor_option_harness.py check | tee /tmp/g2.txt
          python golden/callee_harness.py telegram check | tee /tmp/g3.txt
          # run_pro_scanner: the function that decides what trades at all, and
          # until now the only one of the three big money paths with no golden.
          # Covers the whole gating chain -- VIX halt and score raise, seasonal
          # bar, daily/consecutive loss stops, probation, every hard gate, the
          # effective-min-score bar, the defensive-rotation penalty, the
          # early-session Gap & Hold hold, and the portfolio-heat cap.
          python golden/scanner_harness.py check | tee /tmp/g4.txt
          # run_premarket_briefing: the run that PUSHES state. It pre-builds the
          # scan universe the 9:45 gate loads, re-anchors tracked entry prices to
          # real fills, and dispatches the daemon behind it -- so a silent change
          # here costs a whole session. Pins that the cache carries TODAY's date,
          # that the re-anchor runs (and is skipped when the broker is down), and
          # that the briefing never submits an order.
          python golden/premarket_briefing_harness.py check | tee /tmp/g5.txt
          # NOT gated here, and the reason is worth keeping: regime_harness
          # needs golden/fixtures/regime_inputs.pkl, and that directory is 17MB
          # -- too large for a repo the daemon git-syncs every 5 minutes, so the
          # fixture stays local. main_dispatch_harness is hermetic for 37 of its
          # 38 scenarios but `mode=positions` calls PositionTracker.show(),
          # which reads live prices, so it differs between machines. Both are
          # useful run by hand around a refactor; neither can be a CI baseline
          # as written. Verified by gating them and watching CI fail, which is
          # the only check that actually proves a golden is environment-neutral.
          grep -q "GOLDEN: IDENTICAL" /tmp/g1.txt && grep -q "GOLDEN: IDENTICAL" /tmp/g2.txt && grep -q "GOLDEN: IDENTICAL" /tmp/g3.txt && grep -q "GOLDEN: IDENTICAL" /tmp/g4.txt && grep -q "GOLDEN: IDENTICAL" /tmp/g5.txt

      - name: Regression suite (test_dman_algo.py)
        id: suite
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest test_dman_algo -v

      - name: Validate JSON data files
        id: json
        run: |
          python - <<'EOF'
          import json, glob, sys
          bad = []
          for p in glob.glob("dman_*.json"):
              try:
                  with open(p, encoding="utf-8") as f:
                      json.load(f)
              except Exception as e:
                  bad.append(f"{p}: {e}")
          if bad:
              print("INVALID JSON:\n" + "\n".join(bad))
              sys.exit(1)
          print(f"All {len(glob.glob('dman_*.json'))} JSON data files valid")
          EOF

      # Severity-aware. The old text said "dman_algo.py is broken on main. All
      # trading jobs will fail" for EVERY failure -- including a stale golden
      # recording on 2026-09-22, when nothing was broken and nothing traded.
      # An alarm that cries wolf trains you to ignore the real one.
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          S_SYNTAX:  ${{ steps.syntax.outcome }}
          S_IMPORTS: ${{ steps.imports.outcome }}
          S_JSON:    ${{ steps.json.outcome }}
          S_NAMES:   ${{ steps.names.outcome }}
          S_GOLDEN:  ${{ steps.golden.outcome }}
          S_SUITE:   ${{ steps.suite.outcome }}
          SHA:       ${{ github.sha }}
          RUN_URL:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed=""
          for p in "syntax=$S_SYNTAX" "import=$S_IMPORTS" "state JSON=$S_JSON" \
                   "undefined names=$S_NAMES" "golden harness=$S_GOLDEN" "test suite=$S_SUITE"; do
            [ "${p##*=}" = "failure" ] && failed="$failed ${p%%=*},"
          done
          if [ "$S_SYNTAX" = failure ] || [ "$S_IMPORTS" = failure ] || [ "$S_JSON" = failure ]; then
            head="🚨 <b>CI FAILED — trading is broken</b>"
            why="dman_algo.py or its state files will not load. Scheduled trading jobs fail until this is fixed."
          else
            head="⚠️ <b>CI check failed — trading still runs</b>"
            why="The code loads and runs; a behaviour check disagrees with its recorded expectation. Fix before the next change."
          fi
          text="$head  (${SHA:0:8})
          Failed:${failed%,}
          $why
          $RUN_URL"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            -d "parse_mode=HTML" || true
