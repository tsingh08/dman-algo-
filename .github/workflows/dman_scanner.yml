name: DMan PRO Scanner

on:
  schedule:
    # Sunday 5 PM ET — weekly readiness check, shows which watchlist tickers
    # pass all pre-gap filters heading into Monday
    - cron: '0 21 * * 0'
    # ~7:06 AM ET — early pre-market scanner: sweeps small-cap universe for
    # overnight gaps ≥5% and news catalysts (FDA, merger, squeeze, etc.) so
    # IOTR-style plays are flagged BEFORE the open, not after. Offset from
    # :00 (was "0 11") — confirmed live 2026-08-03: GitHub's own docs warn
    # the schedule event queues behind "the start of every hour," and this
    # repo's own :00/:30 triggers were consistently the most delayed that
    # day (watchdog's 30-min :00/:30 cadence only fired 4/~14 times).
    - cron: '6 11 * * 1-5'
    # NOTE: the 8:00 AM ET full pre-market briefing (regime, macro calendar,
    # fade-risk, sector health) is owned by dman_premarket.yml — do not add
    # a second "0 13 * * 1-5" cron here, it duplicated every briefing message
    # and doubled Benzinga/Claude API cost until removed.
    # 9:45 AM ET — dedicated Gap & Hold scan, fires exactly when the early-session
    # gate opens. 13:30 UTC (9:30 AM) is peak GitHub runner contention (all trading
    # bots hit at once); 13:45 UTC is 15 min quieter and the Gate is already open.
    # (Already off a round number — this one's fine as-is.)
    - cron: '45 13 * * 1-5'
    # ~10:34 AM – 3:34 PM ET hourly for momentum continuation + new setups.
    # Offset from :30 for the same reason as the 7 AM slot above.
    - cron: '34 14,15,16,17,18,19 * * 1-5'
    # ~4:04 PM ET final check / Friday close-out advisory. Offset from :00.
    - cron: '4 20 * * 1-5'
  workflow_dispatch:   # manual trigger from GitHub UI
    inputs:
      mode:
        description: 'Type ONE word only — the mode name. Options: alpaca | pnl | regime | positions | performance | premarket | premarket-early | momentum-watch | readiness | scan-log | watchlist'
        required: false
        default: ''

# Only one scan runs at a time — queues instead of running concurrently.
# Prevents git push conflicts when a scan takes longer than 30 min.
concurrency:
  group: dman-scan
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35   # was 25 — raised to give the retry wrapper below
                          # room to attempt a second pass without risking a
                          # timeout-kill mid-retry on a normal-length scan
    permissions:
      contents: write   # needed to push alert cache back to repo
      actions: write    # lets /restart (picked up via the Telegram poll every run) dispatch a fresh daemon session

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Run DMan PRO Scanner
        env:
          TELEGRAM_TOKEN:      ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          ACCOUNT_SIZE:        ${{ secrets.ACCOUNT_SIZE }}
          APCA_API_KEY_ID:     ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          BENZINGA_API_KEY:    ${{ secrets.BENZINGA_API_KEY }}
          BENZINGA_EARNING_API_KEY: ${{ secrets.BENZINGA_EARNING_API_KEY }}
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          PYTHONIOENCODING:    utf-8
          DISPATCH_MODE:       ${{ github.event.inputs.mode }}
        run: |
          python - <<'EOF'
          from datetime import datetime, date
          import zoneinfo, sys, subprocess, os, time
          ET = zoneinfo.ZoneInfo("America/New_York")
          now = datetime.now(ET)
          today = now.date()
          t = now.hour * 100 + now.minute

          def run_with_retry(cmd, max_attempts=2, backoff_s=15):
              """
              Every second of downed scan coverage is a real missed setup —
              a crash mid-session used to mean waiting up to an hour for the
              next scheduled cron slot. Retries the SAME command once more on
              a non-zero exit before giving up. Safe to retry blindly: any
              signal that was already submitted to Alpaca in a partial first
              attempt is recorded in dman_positions.json before the process
              would exit, and _submit_signals_to_alpaca()'s own
              already_tracked check skips re-submitting a ticker that's
              already an open position — so a retry can only pick up where
              a crash left off, never double-submit.
              """
              result = None
              for attempt in range(1, max_attempts + 1):
                  print(f"  [retry] attempt {attempt}/{max_attempts}: {' '.join(cmd)}")
                  result = subprocess.run(cmd, capture_output=False)
                  if result.returncode == 0:
                      return result
                  print(f"  [retry] attempt {attempt} failed (exit {result.returncode})")
                  if attempt < max_attempts:
                      print(f"  [retry] retrying in {backoff_s}s...")
                      time.sleep(backoff_s)
              print(f"  [retry] all {max_attempts} attempts failed — giving up "
                    f"(top-level crash handler already sent a Telegram alert)")
              return result

          # Manual dispatch with mode override (e.g. "pnl" for on-demand P&L check).
          # .lower() because argparse's `choices` is case-sensitive and the
          # dispatch input is free-text — 3 manual runs on 2026-07-28 ("Alpaca",
          # "Alpaca", "Scan") crashed instantly on this alone.
          _dispatch_mode = os.environ.get("DISPATCH_MODE", "").strip().lower()
          if _dispatch_mode == "scan":
              # A bare `--mode scan` (no --universe/--ai/--submit) only alerts —
              # it does NOT place real orders, unlike every scheduled scan.
              # Someone manually dispatching "scan" to force immediate coverage
              # (e.g. right at market open, not wanting to wait for a delayed
              # cron) almost certainly wants the real thing, not a silent dry
              # run — so this mirrors the scheduled pre-10am command exactly.
              result = subprocess.run(
                  [sys.executable, "dman_algo.py", "--mode", "scan",
                   "--universe", "curated", "--ai", "--submit"],
                  capture_output=False
              )
              sys.exit(result.returncode)
          if _dispatch_mode:
              result = subprocess.run(
                  [sys.executable, "dman_algo.py", "--mode", _dispatch_mode],
                  capture_output=False
              )
              sys.exit(result.returncode)

          # Sunday 5 PM ET — weekly readiness check for Monday gaps
          if now.weekday() == 6:
              result = subprocess.run(
                  [sys.executable, "dman_algo.py", "--mode", "readiness"],
                  capture_output=False
              )
              sys.exit(result.returncode)

          # NYSE market holidays — market closed, nothing to scan
          MARKET_HOLIDAYS = {
              date(2025,  1,  1), date(2025,  1, 20), date(2025,  2, 17),
              date(2025,  4, 18), date(2025,  5, 26), date(2025,  6, 19),
              date(2025,  7,  4), date(2025,  9,  1), date(2025, 11, 27),
              date(2025, 12, 25),
              date(2026,  1,  1), date(2026,  1, 19), date(2026,  2, 16),
              date(2026,  4,  3), date(2026,  5, 25), date(2026,  6, 19),
              date(2026,  7,  3), date(2026,  9,  7), date(2026, 11, 26),
              date(2026, 12, 25),
              date(2027,  1,  1), date(2027,  1, 18), date(2027,  2, 15),
              date(2027,  3, 26), date(2027,  5, 31), date(2027,  6, 18),
              date(2027,  7,  5), date(2027,  9,  6), date(2027, 11, 25),
              date(2027, 12, 24),
          }
          if today in MARKET_HOLIDAYS:
              print(f"NYSE holiday ({now.strftime('%a %b %d')}) — market closed, skipping scan.")
              sys.exit(0)

          # 7:00 AM ET — early pre-market scan for overnight gaps and news catalysts.
          # Window: 6:50 AM – 8:30 AM (absorbs runner queue; stops before 9 AM briefing).
          if now.weekday() < 5 and 650 <= t <= 830:
              result = subprocess.run(
                  [sys.executable, "dman_algo.py", "--mode", "premarket-early"],
                  capture_output=False
              )
              sys.exit(result.returncode)

          # Fallback only — dman_premarket.yml owns the 8 AM briefing on its own
          # dedicated cron. This window only fires if some OTHER scanner cron
          # (e.g. the 7 AM slot) gets delayed into 8:55-9:59 AM, giving a rare
          # incidental backup without a second guaranteed daily trigger.
          if now.weekday() < 5 and 855 <= t <= 959:
              result = subprocess.run(
                  [sys.executable, "dman_algo.py", "--mode", "premarket"],
                  capture_output=False
              )
              sys.exit(result.returncode)

          # 4:00 PM ET EOD P&L summary.
          # Must be checked BEFORE the market-hours gate below because GitHub
          # Actions runners often queue 3-10 min past cron fire time — by the
          # time Python runs it's 4:03-4:08 PM (t=1603-1608) and the strict
          # t<=1600 guard would silently exit, which is why P&L never arrived.
          # Window: 3:55 PM – 4:20 PM ET to absorb all realistic queue delays.
          if now.weekday() < 5 and 1555 <= t <= 1620:
              result = subprocess.run(
                  [sys.executable, "dman_algo.py", "--mode", "pnl"],
                  capture_output=False
              )
              sys.exit(result.returncode)

          if now.weekday() >= 5 or not (930 <= t <= 1600):
              print(f"Market closed ({now.strftime('%a %H:%M ET')}) — skipping scan.")
              sys.exit(0)
          # Daily watchlist fires on the 9:45 AM scan (first scan of the day)
          if 945 <= t <= 1005:
              subprocess.run(
                  [sys.executable, "dman_algo.py", "--mode", "watchlist"],
                  capture_output=False
              )
          # Before 10 AM: curated universe only — fast, catches gap-and-holds at gate open.
          # After 10 AM: full universe for momentum continuation plays.
          universe = "curated" if t < 1000 else "all"
          result = run_with_retry(
              [sys.executable, "dman_algo.py", "--mode", "scan",
               "--universe", universe, "--ai", "--submit"]
          )
          # 10 AM–3:30 PM: run momentum watch alongside the main scan.
          # Detects breakout setups forming + exit/trail signals on open positions.
          # Options positions have no broker-side exit — they rely entirely on this
          # loop for T1/T2 alerts. Must run through the full session, not just open.
          if 1000 <= t <= 1600:
              run_with_retry(
                  [sys.executable, "dman_algo.py", "--mode", "momentum-watch"]
              )
          # Redundant coverage for the daemon's earnings_loop: the daemon checks
          # out code ONCE per session and doesn't hot-reload, so a same-day code
          # deploy can miss its whole window (confirmed: shipped 2:47 PM ET on
          # 2026-07-29, daemon's session had already checked out at 1:59 PM ET,
          # so it never actually ran that day — META reported earnings that
          # close with no offer ever sent). This cron re-checks-out fresh code
          # every single run, so it closes that gap. Idempotent — safe every hour.
          subprocess.run([sys.executable, "dman_algo.py", "--mode", "earnings-scan"],
                        capture_output=False)
          sys.exit(result.returncode)
          EOF

      - name: Persist alert cache and live signal logs
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # Confirmed live 2026-08-10: `git rebase --continue` after resolving
          # a conflict needs to open an editor for the commit message — with
          # no interactive terminal on a runner, that failed with "Terminal is
          # dumb, but EDITOR unset", which the `|| git rebase --abort`
          # fallback then treated as an unrecoverable conflict and discarded,
          # silently dropping that ENTIRE run's real scan results (verified:
          # a genuine "No A+ setups today" scan output with real universe
          # data never made it into dman_scan_log.json for at least 2
          # separate Monday runs). `true` as the editor accepts git's own
          # auto-generated rebase commit message with no prompt needed.
          git config core.editor true

          # Fetch BEFORE staging/merging so dman_positions.json can be
          # semantically merged against origin/main's current copy. The
          # always-on daemon and this hourly scanner both independently
          # raise stops to breakeven / reduce shares after a partial sell on
          # the SAME positions from separate concurrency groups — a plain
          # git conflict resolution can silently drop whichever side did
          # more protective work. merge-positions replaces that with a rule
          # that can't regress protection (see merge_positions_snapshots()).
          git fetch origin main
          python dman_algo.py --mode merge-positions || true

          # STATE_FILES includes files that are created lazily (dman_halt.json,
          # dman_telegram_state.json only exist after the first /halt or bot
          # command). `git add a.json missing.json` fails ATOMICALLY on the
          # missing pathspec and silently stages NOTHING — not even a.json —
          # so every file must be existence-checked individually, never
          # passed to one bare `git add f1 f2 f3` call.
          # dman_sec_cik_map.json: SEC EDGAR ticker->CIK map backing the free
          # insider-buying signal (check_insider_activity). Runners are
          # ephemeral (fresh checkout every run) — without persisting this
          # back to the repo, the 1-week on-disk TTL cache is pointless and
          # every run re-downloads the full ~800KB map before it can check
          # a single ticker's Form 4s.
          # dman_options_feed_state.json / dman_stock_feed_state.json: same
          # ephemeral-runner problem hit both entitlement probes' in-memory
          # caches — confirmed live 2026-08-08, the "options data feed
          # downgraded" Telegram alert was repeating on every single run
          # because a fresh process always saw the cache as unset, not
          # because entitlement kept flapping. Persisting makes both the
          # hourly recheck throttle and the alert-on-change dedup actually
          # work across runs. The stock-side file backs the same detection
          # for Algo Trader Plus's SIP feed, added 2026-08-09 after ATP
          # billing voided twice before finally activating.
          STATE_FILES="dman_last_alerts.json dman_live_signals.json dman_live_outcomes.csv \
                       dman_alpaca_sync.json dman_positions.json \
                       dman_win_rate.json dman_monthly_pnl.json dman_daily_pnl.json \
                       dman_scan_log.json dman_universe_cache.json \
                       dman_stocktwits_seen.json dman_smallcap_watchlist.json \
                       dman_telegram_state.json dman_halt.json dman_alerts_dedup.json \
                       dman_earnings_pending.json dman_rate_limit_events.json \
                       dman_sec_cik_map.json dman_options_feed_state.json \
                       dman_stock_feed_state.json dman_telegram_options_menu.json \
                       dman_telegram_manual_buy.json"

          # Defense-in-depth: never stage a corrupted .json file. This caught
          # a real production incident — the daemon's git-stash-pop conflict
          # handling (separately fixed) once left literal <<<<<<< conflict
          # markers in dman_alpaca_sync.json, which the old code would have
          # committed and pushed as-is. Any file that fails to parse here is
          # restored from the last good commit and skipped this cycle only.
          for f in $STATE_FILES; do
            if [ -f "$f" ]; then
              case "$f" in
                *.json)
                  if ! python -c "import json,sys; json.load(open(sys.argv[1]))" "$f" 2>/dev/null; then
                    echo "  ⚠️  $f failed JSON validation — restoring last good commit"
                    git checkout -- "$f" 2>/dev/null || true
                  fi
                  ;;
              esac
              git add "$f"
            fi
          done

          if git diff --staged --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "chore: update alert/signal cache [skip ci]"
          # Re-fetch/rebase in case something else pushed during the scan+merge above
          git fetch origin main
          # Confirmed live 2026-08-07: a stray uncommitted change (source
          # unclear -- possibly a side effect of merge-positions writing
          # after this point, possibly a lingering write from the scan step
          # above) appeared between the commit above and this rebase,
          # causing "cannot rebase: You have unstaged changes" -- a
          # precondition failure, NOT a merge conflict. The conflict-recovery
          # path below (git rebase --continue/--abort) has nothing to
          # recover from in that case and fails with "no rebase in
          # progress", killing the whole step with exit 128 -- the actual
          # scan had already succeeded, only this state-persist step died.
          # Absorbing any stray change into its own commit first means the
          # working tree is always clean before rebase is ever attempted.
          if ! git diff --quiet || ! git diff --staged --quiet; then
            echo "Stray uncommitted change detected before rebase — absorbing into its own commit"
            git add -A
            git commit -m "chore: absorb stray state change [skip ci]" || true
          fi
          if ! git rebase origin/main; then
            # NOTE: during `git rebase` (unlike `git merge`), --ours/--theirs
            # are REVERSED — "ours" resolves to the upstream commit we're
            # rebasing ONTO, "theirs" resolves to the commit being replayed
            # (our new scan data). Verified by direct reproduction — this was
            # `--ours` for weeks and silently discarded real scan results
            # (and any signal found in them) on every rebase conflict.
            echo "Rebase conflict on data files — keeping our new scan data (theirs, during rebase)"
            for f in $STATE_FILES; do
              [ -f "$f" ] && git checkout --theirs -- "$f" 2>/dev/null
            done
            git add -u
            git rebase --continue || git rebase --abort
          fi
          # Try push; if rejected (race), fetch-rebase-push once more
          if ! git push origin HEAD:main; then
            echo "First push rejected — refetching and retrying"
            git fetch origin main
            if ! git diff --quiet || ! git diff --staged --quiet; then
              git add -A
              git commit -m "chore: absorb stray state change [skip ci]" || true
            fi
            git rebase origin/main || git rebase --abort
            git push origin HEAD:main || echo "ERROR: data push failed after retry — check branch protection rules"
          fi

      - name: Notify on workflow failure
        if: failure()
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Only fires for pre-Python failures (checkout/install) — Python crashes
          # send their own detailed 🚨 message and exit 1, so this is a safety net only.
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=⚠️ <b>DMan scan FAILED</b> — pre-run step failed (checkout/install). Check GitHub Actions." \
            -d "parse_mode=HTML" || true
