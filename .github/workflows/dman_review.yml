name: DMan Session Review

# Post-close (and on-demand via /review on Telegram) review session — a
# real Claude Code agent, not more hand-written Python heuristics, reads
# the day's actual state (positions, P&L, recent trades, scan history)
# and the codebase itself, and reports what it finds: how the session
# went, anything that looks off heading into the next trading day, and
# specific code improvements it would recommend.
#
# Also runs at midday (added 2026-08-22, direct instruction) — same
# mechanism, same safety model, but with time-remaining-in-the-session
# framing instead of a post-mortem one, so real findings can be acted on
# same-day instead of only in hindsight after close. Which framing a run
# uses is decided by the actual ET time it executes at (the "Determine
# review kind" step below), not which trigger fired it — a manual /review
# at 11 AM gets the midday framing, at 6 PM gets the EOD one, regardless
# of source.
#
# The MIDDAY run stays REPORT ONLY, deliberately, by construction rather
# than just instruction — direct decision 2026-08-21 after the /review idea
# was raised, unchanged for midday: it never gets Edit/Write/git-commit
# tools at all, so even if it tried, there is nothing in its toolset capable
# of changing a file. No Alpaca credentials (APCA_API_KEY_ID/
# APCA_API_SECRET_KEY) are passed to this job at all, for either kind — the
# agent works from the git-tracked state files the daemon already keeps
# synced (dman_positions.json, dman_win_rate.json, dman_daily_pnl.json,
# dman_scan_log.json, dman_news_log.json), not a live broker session. It is
# structurally incapable of placing a real order here, not just told not to.
#
# The EOD run can propose real code changes as of 2026-08-24 (direct
# request) — but structurally as a PR, never a direct push to main, same
# "not just told not to" philosophy applied to the new capability instead of
# removed for it:
#   1. The "Create review branch" step below checks out a fresh branch
#      BEFORE Claude ever runs. The EOD invocation's --allowedTools includes
#      Edit/Write/git add/git commit, but deliberately NEVER git checkout,
#      git push, or gh — so even with contents: write at the job level, the
#      agent has no tool in its box capable of reaching origin or switching
#      back to main. It can only edit files and commit locally to the one
#      branch the workflow already put it on.
#   2. A SEPARATE step ("Push review branch and open PR") that runs after
#      Claude exits — plain shell script, not the agent — checks whether
#      any commits actually landed, and if so pushes THAT branch (git push
#      -u origin HEAD, never main) and opens a PR against main with gh pr
#      create. Nothing merges automatically; a human reviews the PR through
#      the same process every other change in this repo already goes
#      through. If Claude proposed nothing (the common case most nights),
#      no branch is ever pushed and no PR is opened.
#   3. main itself is never protected against direct pushes (the always-on
#      daemon depends on pushing its own state-sync commits straight to
#      main continuously through the trading day — branch-protecting main
#      would break that), so this guarantee lives entirely in what tools
#      the agent is handed, not in a GitHub-side restriction. Worth knowing
#      if this workflow is ever edited again: removing the branch-creation
#      step or widening --allowedTools to include git checkout/push/gh
#      undoes the structural guarantee, not just a stated preference.

on:
  schedule:
    # ~12:34 PM ET weekdays (16:34 UTC) — midday check, well clear of the
    # 9:45 AM Gap & Hold scan and the 10:34 AM-3:34 PM hourly momentum
    # scans' own :34 slots (offset to :34 like those, same GitHub-queue-
    # congestion reasoning as every other cron here).
    - cron: '34 16 * * 1-5'
    # ~4:20 PM ET weekdays (20:20 UTC) — after the 4:04 PM EOD P&L summary
    # and momentum-watch have both settled, so today's real close-of-day
    # state is fully synced before the review reads it. Offset from :00
    # for the same GitHub-queue-congestion reasoning every other cron in
    # this repo already uses (see dman_watchdog.yml's comment for the
    # confirmed-live incident behind that pattern).
    - cron: '24 20 * * 1-5'
  workflow_dispatch:   # /review on Telegram dispatches this directly

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Only one review runs at a time — an on-demand /review firing seconds
# after the scheduled 4:20 PM run would otherwise race on the same repo
# state (harmless since both are read-only, but wastes a full session).
concurrency:
  group: dman-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # needed to push the review/* branch created below --
                               # see the file header for why this can't reach main
      pull-requests: write   # needed for the "open PR" step's `gh pr create`

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Determine review kind
        id: kind
        run: |
          ET_HOUR=$(TZ="America/New_York" date +%H)
          # Same 10 AM-3 PM ET window as the prompt-selection logic below --
          # computed once here so the branch-creation step (EOD only) and
          # the review-session step agree on which kind this run is,
          # instead of recomputing (and risking drifting from) it twice.
          if [ "$ET_HOUR" -ge 10 ] && [ "$ET_HOUR" -lt 15 ]; then
            echo "kind=midday" >> "$GITHUB_OUTPUT"
          else
            echo "kind=eod" >> "$GITHUB_OUTPUT"
          fi

      - name: Create review branch
        if: steps.kind.outputs.kind == 'eod'
        id: branch
        run: |
          BRANCH="review/$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "dman-review-bot"
          git config user.email "dman-review-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run review session
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KIND: ${{ steps.kind.outputs.kind }}
        run: |
          SHARED_CONTEXT='You are checking in on a live-money algorithmic
          trading system in this repo. You have NO live broker credentials
          -- work entirely from the git-tracked state files and codebase.

          Look at: dman_positions.json (currently open positions),
          dman_win_rate.json (recent trade outcomes), dman_daily_pnl.json /
          dman_monthly_pnl.json (realized P&L), dman_scan_log.json (recent
          scan activity), dman_news_log.json (recent headlines), dman_halt.json
          and dman_probation.json if present (current risk-control state),
          and recent git log / diffs for anything that changed today. Cross-
          reference against dman_algo.py and dman_daemon.py as needed to
          understand what a given state actually means.

          If you are not sure whether something needs a human decision, say
          so explicitly rather than assuming an answer.

          Keep your FINAL reply under 3500 characters -- it is posted
          directly to a phone via Telegram. Use plain text, no markdown
          tables.'

          if [ "$KIND" = "midday" ]; then
            ALLOWED_TOOLS="Read,Grep,Glob,Bash(git log:*),Bash(git diff:*),Bash(git show:*)"
            PROMPT="$SHARED_CONTEXT"'

          You have READ-ONLY repo access this run -- report only, the same
          as always for a midday check.

          It is currently mid-session -- the market is open and there is
          real time left today to act on what you find. Produce a concise,
          ACTIONABLE check-in covering:
          1. What has happened so far today -- anything closed, anything
             new opened, current realized P&L, current open risk exposure.
          2. Anything that needs attention THIS AFTERNOON specifically --
             a position nearing its stop/target, a circuit breaker state
             that changes what can still be entered today, a scan that
             silently failed this morning.
          3. What is worth watching for the rest of today -- an upcoming
             scheduled event later today or tomorrow morning that changes
             risk (from dman_algo.py'"'"'s own macro-event calendars:
             _FOMC_DATES, _CPI_DATES, _PPI_DATES, _PCE_DATES,
             _MAJOR_MACRO_EVENT_DATES, earnings dates on open positions),
             or a setup/sector that has looked notably strong or weak in
             today'"'"'s scan log so far.

          Do not spend much space on code recommendations here -- that is
          what the end-of-day review is for. Only mention one if it is
          urgent enough to matter before tomorrow.'
          else
            # EOD only, added 2026-08-24: real Edit/Write/local-commit
            # access, deliberately still missing git checkout/push/gh --
            # see the file header for why that specific gap is what keeps
            # this PR-only rather than main-reachable. Already on a fresh
            # review/* branch from the "Create review branch" step above.
            ALLOWED_TOOLS="Read,Grep,Glob,Edit,Write,Bash(git add:*),Bash(git commit:*),Bash(git status:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"
            PROMPT="$SHARED_CONTEXT"'

          You ALSO have Edit/Write access and can make real code changes
          this run, already checked out on a fresh branch off main. If you
          find something genuinely worth fixing -- not everything has to
          be, most nights nothing will be -- make the change and commit it
          locally (git add + git commit; you do not have git push or gh,
          a separate step handles turning your commit(s) into a PR against
          main if you make any). Prioritize small, well-verified,
          low-risk fixes over ambitious rewrites: this runs unattended
          overnight, no human is watching it work, and whatever you commit
          becomes a real PR someone reviews tomorrow -- favor a fix you
          are genuinely confident in over one that merely looks plausible.
          If you are not confident a change is correct, describe it in
          your report instead of committing something shaky. Never edit
          .github/workflows/dman_review.yml itself (this file) -- a
          change to the workflow that runs you should go through a normal
          human-initiated session, not this one.

          You are reviewing the just-closed (or most recent) trading
          session. Produce a concise report covering:
          1. How the session actually went -- realized P&L, what closed, what
             is still open and its current risk exposure.
          2. Anything that looks off, risky, or worth flagging before the
             next trading day -- stale/inconsistent state, a setup with a
             notably bad recent record, a circuit breaker in an unexpected
             state, anything that would surprise a human reviewing it fresh.
          3. Specific, concrete code improvements you would recommend -- name
             the file/function, describe the change, and why. Do not just
             gesture at "the code could be cleaner" -- be specific enough that
             someone could hand this straight to a follow-up session to
             implement. Say clearly whether you already committed each one
             or are only describing it.

          Prioritize the most important 3-5 findings over an exhaustive
          list.'
          fi

          set +e
          OUTPUT=$(claude -p "$PROMPT" \
            --model claude-fable-5 \
            --dangerously-skip-permissions \
            --allowedTools "$ALLOWED_TOOLS" \
            2>&1)
          STATUS=$?
          set -e

          echo "review_kind=$KIND" >> "$GITHUB_OUTPUT"

          echo "exit_status=$STATUS" >> "$GITHUB_OUTPUT"

          # Telegram's hard cap is 4096 chars -- truncate defensively even
          # though the prompt already asks for <3500.
          TRUNCATED=$(echo "$OUTPUT" | cut -c1-3900)
          {
            echo "review_output<<REVIEW_EOF"
            echo "$TRUNCATED"
            echo "REVIEW_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Push review branch and open PR
        # EOD only. Deliberately a plain script, not the agent -- see the
        # file header. Runs even if the review step's OWN exit code was
        # non-zero (set +e above keeps the job itself green regardless),
        # since a real commit can still be sitting on the branch even if
        # Claude hit an error after making it; only skip if there's
        # nothing to push.
        if: steps.kind.outputs.kind == 'eod'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          COMMIT_COUNT=$(git rev-list --count origin/main.."$BRANCH" 2>/dev/null || echo 0)
          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "  No commits on $BRANCH -- nothing to push, no PR."
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push -u origin HEAD
          PR_URL=$(gh pr create \
            --title "DMan review: $(date -u +%Y-%m-%d) findings" \
            --body "Opened automatically by the after-close /review session. $COMMIT_COUNT commit(s) on this branch -- see the Telegram report from the same run for the full writeup, and the commits themselves for what actually changed. Nothing here has been merged; review before merging, same as any other PR." \
            --base main --head "$BRANCH")
          echo "  PR opened: $PR_URL"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Post report to Telegram
        if: always()
        env:
          REVIEW_OUTPUT: ${{ steps.review.outputs.review_output }}
          REVIEW_STATUS: ${{ steps.review.outputs.exit_status }}
          REVIEW_KIND:   ${{ steps.review.outputs.review_kind }}
          PR_URL:        ${{ steps.pr.outputs.pr_url }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'EOF'
          import os, html, requests
          token  = os.environ["TELEGRAM_TOKEN"]
          chat   = os.environ["TELEGRAM_CHAT_ID"]
          status = os.environ.get("REVIEW_STATUS", "1")
          kind   = os.environ.get("REVIEW_KIND", "eod")
          pr_url = os.environ.get("PR_URL", "").strip()
          label  = "midday check-in" if kind == "midday" else "session review"
          header = (f"🔎 <b>DMan {label}</b>" if status == "0" else
                     f"⚠️ <b>DMan {label} — the run itself hit an error, showing what it captured</b>")
          body = os.environ.get("REVIEW_OUTPUT", "").strip() or "(no output captured)"
          # Confirmed live 2026-09-02: a real Anthropic account credit
          # exhaustion surfaces here as the bare CLI error string with zero
          # context -- technically "sent to Telegram" but genuinely
          # confusing (just "Credit balance is too low", no explanation of
          # what's low on credits or what to do about it). This is a
          # billing action only the account owner can take (add funds at
          # console.anthropic.com) -- no code fix restores it -- so the
          # one thing worth improving here is making the alert say that
          # plainly instead of relaying the raw error.
          if "credit balance is too low" in body.lower():
              header = "💳 <b>DMan session review unavailable — Anthropic API credits exhausted</b>"
              body = (
                  "The ANTHROPIC_API_KEY used for session reviews (and the live scanner's "
                  "AI-scoring step) is out of credits.\n\n"
                  "Fix: add funds at console.anthropic.com for the account that owns this key, "
                  "then session reviews resume automatically -- no code change needed.\n\n"
                  "Does NOT affect live trading: AI-scoring fails OPEN by design (falls back to "
                  "confluence-only scoring, never blocks a trade) -- confirmed no live scan hit "
                  "this today."
              )
          text = f"{header}\n\n{html.escape(body)}"
          if kind == "eod" and pr_url:
              text += f"\n\n📤 <b>PR opened:</b> {html.escape(pr_url)}"
          requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data={"chat_id": chat, "text": text, "parse_mode": "HTML"},
              timeout=15,
          )
          EOF

      - name: Notify on workflow failure
        if: failure()
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=⚠️ <b>DMan review FAILED</b> — pre-run step failed (checkout/install). Check GitHub Actions." \
            -d "parse_mode=HTML" || true
