name: DMan Cloud Daemon

# Runs the always-on daemon on GitHub's runners using the secrets already
# stored in this repo — zero local setup, nothing to click.
#
# GitHub caps a job at 6 hours, so the trading day is covered by three
# back-to-back sessions sharing a concurrency group:
#   Session A: ~9:23 AM ET  → exits itself at 12:55 PM ET
#   Session B: ~12:53 PM ET → cancels A (seamless handover) → exits ~5:00 PM ET
#   Session C: ~4:53 PM ET  → cancels B (seamless handover) → exits ~8:05 PM ET
#
# Session C (added 2026-08-13) extends coverage through the post-market
# close — NOT for order execution (guard_loop's actual stop/T1 order
# management stays gated to 9:25 AM-4:05 PM ET via market_hours(), so
# nothing changes there), but because the real-time news and (widened,
# curated-universe) equity quote streams are NOT time-gated and keep
# alerting on AMC earnings reactions through the evening instead of going
# fully dark from ~4:20 PM until the next morning's premarket cron.
#
# The daemon gives: options stop/T1/T2 enforcement every 60s, instant fill
# alerts via websocket, real-time Telegram commands, 5-min fill sync, and
# git state sync with the hourly scanner runs.

on:
  schedule:
    # Minutes offset from :20/:50 to :23/:53 — confirmed live 2026-08-03:
    # the morning session's schedule trigger didn't actually start until
    # ~11:55 AM ET, over 2.5 hours late. GitHub's own docs warn scheduled
    # triggers queue behind "the start of every hour" and other round
    # times; a non-round minute lands in a quieter part of the queue.
    # Session-end-time logic below already computes off the real current
    # hour, not the trigger minute, so this doesn't change anything else.
    - cron: '23 13 * * 1-5'   # ~9:23 AM ET — morning session
    - cron: '53 16 * * 1-5'   # ~12:53 PM ET — afternoon session (takes over)
    - cron: '53 20 * * 1-5'   # ~4:53 PM ET — evening session (takes over, post-market coverage)
  workflow_dispatch:

# Afternoon session cancels the (nearly finished) morning session so exactly
# one daemon is ever running — no double alerts, no double orders.
concurrency:
  group: dman-daemon
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  daemon:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write   # git state sync (positions, halt flag, telegram offset)
      actions: write    # lets a live daemon session self-restart on /restart via its own Telegram poll

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Pick session end time
        id: session
        run: |
          python - <<'EOF'
          import zoneinfo, datetime, os
          ET = zoneinfo.ZoneInfo("America/New_York")
          now = datetime.datetime.now(ET)
          # Morning start (hour<12) → hand over at 12:55 ET.
          # Afternoon start (12<=hour<16) → run to 17:00 ET — extended from
          # the old 16:12 exit as a safety-net overlap with the new evening
          # session's ~16:53 start, so a late/failed evening trigger still
          # leaves the afternoon session covering until 17:00 instead of a
          # cold stop at 16:12.
          # Evening start (hour>=16) → run to 20:05 ET, through the 8 PM
          # post-market close (see the workflow header comment).
          if now.hour < 12:
              until = "1255"
          elif now.hour < 16:
              until = "1700"
          else:
              until = "2005"
          print(f"Session start {now:%H:%M} ET — running until {until} ET")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"until={until}\n")
          EOF

      - name: Run daemon session
        env:
          APCA_API_KEY_ID:     ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          TELEGRAM_TOKEN:      ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          ACCOUNT_SIZE:        ${{ secrets.ACCOUNT_SIZE }}
          BENZINGA_API_KEY:    ${{ secrets.BENZINGA_API_KEY }}
          BENZINGA_EARNING_API_KEY: ${{ secrets.BENZINGA_EARNING_API_KEY }}
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          DAEMON_RUN_UNTIL:    ${{ steps.session.outputs.until }}
          PYTHONIOENCODING:    utf-8
          # Real-time equity position price streaming + continuous T1/stop
          # guard (see market_data_stream_loop / run_equity_guard in
          # dman_algo.py). Built and live-verified 2026-08-09, enabled
          # 2026-08-10 following the CLRO incident (a spike from $9.80 to
          # $14.08 that reversed before hitting T1, giving back the entire
          # gain with zero protection since equity positions previously had
          # no continuous daemon-side monitoring at all).
          ENABLE_REALTIME_EQUITY_STREAM: "true"
          # Real-time options quote streaming + continuous stop/trail/T1
          # guard fed from the live cache instead of a fresh REST snapshot
          # every 60s check (see option_data_stream_loop / get_snapshot_fn
          # in dman_algo.py / dman_daemon.py). Built and live-verified
          # 2026-08-12, enabled the same day — same reconnect-storm-guarded
          # pattern as ENABLE_REALTIME_EQUITY_STREAM above, applied to
          # options positions.
          ENABLE_REALTIME_OPTIONS_STREAM: "true"
          # Real-time news headline streaming — instant Telegram alert on a
          # relevant headline instead of waiting for the next scan_loop pass
          # or hourly cron's REST poll (see news_data_stream_loop in
          # dman_daemon.py). Built and live-verified 2026-08-13, enabled the
          # same day. Lower-risk than the two streams above: alert-only, it
          # never touches order submission — the existing REST-based Massive
          # sentiment gate still governs every new entry unchanged.
          ENABLE_REALTIME_NEWS_STREAM: "true"
        run: python dman_daemon.py

      - name: Notify on daemon failure
        if: failure()
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Cancellation by the afternoon session is normal handover (not failure).
          # This fires only on genuine crashes/setup failures — the hourly cron
          # scans still enforce exits as backup, but tell the user immediately.
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=🚨 <b>Cloud daemon session FAILED</b> — real-time guard is down. Hourly cron scans still enforce options exits as backup. Check GitHub Actions when you can." \
            -d "parse_mode=HTML" || true
