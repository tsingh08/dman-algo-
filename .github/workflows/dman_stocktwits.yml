name: DMan StockTwits Monitor

on:
  schedule:
    # Every 2 hours 7 AM – 4 PM ET (11:00–20:00 UTC), weekdays
    - cron: '0 11,13,15,17,19 * * 1-5'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  stocktwits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Monitor StockTwits
        env:
          TELEGRAM_TOKEN:      ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          APCA_API_KEY_ID:     ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          ACCOUNT_SIZE:        ${{ secrets.ACCOUNT_SIZE }}
          PYTHONIOENCODING:    utf-8
        run: python dman_algo.py --mode stocktwits

      - name: Commit new tickers and seen cache
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add dman_stocktwits_seen.json dman_smallcap_watchlist.json || true
          if git diff --staged --quiet; then
            echo "No StockTwits changes to commit"
            exit 0
          fi
          git commit -m "feat: auto-add DMan StockTwits calls to watchlist data file [skip ci]"
          git fetch origin main
          if ! git rebase origin/main; then
            echo "Rebase conflict — keeping our watchlist additions and seen cache"
            git checkout --ours -- dman_smallcap_watchlist.json dman_stocktwits_seen.json 2>/dev/null || true
            git add dman_smallcap_watchlist.json dman_stocktwits_seen.json
            git rebase --continue || git rebase --abort
          fi
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main || git rebase --abort
            git push origin HEAD:main || echo "ERROR: StockTwits push failed after retry"
          fi
