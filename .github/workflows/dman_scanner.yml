name: DMan PRO Scanner

on:
  schedule:
    # Sunday 5 PM ET — weekly readiness check, shows which watchlist tickers
    # pass all pre-gap filters heading into Monday
    - cron: '0 21 * * 0'
    # 7:00 AM ET — early pre-market scanner: sweeps small-cap universe for
    # overnight gaps ≥5% and news catalysts (FDA, merger, squeeze, etc.) so
    # IOTR-style plays are flagged BEFORE the open, not after.
    - cron: '0 11 * * 1-5'
    # 9:00 AM ET — pre-market briefing: regime, macro calendar, live gaps, fade-risk,
    # sector health, scanner watchdog. Runs before market open so fast_info returns
    # actual pre-market prices, not intraday prices.
    - cron: '0 13 * * 1-5'
    # 9:45 AM ET — dedicated Gap & Hold scan, fires exactly when the early-session
    # gate opens. 13:30 UTC (9:30 AM) is peak GitHub runner contention (all trading
    # bots hit at once); 13:45 UTC is 15 min quieter and the Gate is already open.
    - cron: '45 13 * * 1-5'
    # Hourly 10:30 AM – 3:30 PM ET for momentum continuation + new setups
    - cron: '30 14,15,16,17,18,19 * * 1-5'
    # 4:00 PM ET final check / Friday close-out advisory
    - cron: '0 20 * * 1-5'
  workflow_dispatch:   # manual trigger from GitHub UI
    inputs:
      mode:
        description: 'Type ONE word only — the mode name. Options: alpaca | pnl | regime | positions | performance | premarket | premarket-early | momentum-watch | readiness | scan-log | watchlist'
        required: false
        default: ''

# Only one scan runs at a time — queues instead of running concurrently.
# Prevents git push conflicts when a scan takes longer than 30 min.
concurrency:
  group: dman-scan
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write   # needed to push alert cache back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Run DMan PRO Scanner
        env:
          TELEGRAM_TOKEN:      ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          ACCOUNT_SIZE:        ${{ secrets.ACCOUNT_SIZE }}
          APCA_API_KEY_ID:     ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          BENZINGA_API_KEY:    ${{ secrets.BENZINGA_API_KEY }}
          PYTHONIOENCODING:    utf-8
          DISPATCH_MODE:       ${{ github.event.inputs.mode }}
        run: |
          python - <<'EOF'
          from datetime import datetime, date
          import zoneinfo, sys, subprocess, os
          ET = zoneinfo.ZoneInfo("America/New_York")
          now = datetime.now(ET)
          today = now.date()
          t = now.hour * 100 + now.minute

          # Manual dispatch with mode override (e.g. "pnl" for on-demand P&L check)
          _dispatch_mode = os.environ.get("DISPATCH_MODE", "").strip()
          if _dispatch_mode:
              result = subprocess.run(
                  [sys.executable, "dman_algo.py", "--mode", _dispatch_mode],
                  capture_output=False
              )
              sys.exit(result.returncode)

          # Sunday 5 PM ET — weekly readiness check for Monday gaps
          if now.weekday() == 6:
              result = subprocess.run(
                  [sys.executable, "dman_algo.py", "--mode", "readiness"],
                  capture_output=False
              )
              sys.exit(result.returncode)

          # NYSE market holidays — market closed, nothing to scan
          MARKET_HOLIDAYS = {
              date(2025,  1,  1), date(2025,  1, 20), date(2025,  2, 17),
              date(2025,  4, 18), date(2025,  5, 26), date(2025,  6, 19),
              date(2025,  7,  4), date(2025,  9,  1), date(2025, 11, 27),
              date(2025, 12, 25),
              date(2026,  1,  1), date(2026,  1, 19), date(2026,  2, 16),
              date(2026,  4,  3), date(2026,  5, 25), date(2026,  6, 19),
              date(2026,  7,  3), date(2026,  9,  7), date(2026, 11, 26),
              date(2026, 12, 25),
              date(2027,  1,  1), date(2027,  1, 18), date(2027,  2, 15),
              date(2027,  3, 26), date(2027,  5, 31), date(2027,  6, 18),
              date(2027,  7,  5), date(2027,  9,  6), date(2027, 11, 25),
              date(2027, 12, 24),
          }
          if today in MARKET_HOLIDAYS:
              print(f"NYSE holiday ({now.strftime('%a %b %d')}) — market closed, skipping scan.")
              sys.exit(0)

          # 7:00 AM ET — early pre-market scan for overnight gaps and news catalysts.
          # Window: 6:50 AM – 8:30 AM (absorbs runner queue; stops before 9 AM briefing).
          if now.weekday() < 5 and 650 <= t <= 830:
              result = subprocess.run(
                  [sys.executable, "dman_algo.py", "--mode", "premarket-early"],
                  capture_output=False
              )
              sys.exit(result.returncode)

          # 9:00 AM ET — pre-market briefing (before regular session opens).
          # Must be checked before the 930-1600 market-hours guard below.
          # Window extends to 9:59 AM to absorb runner queue delays (peak-hour
          # GitHub Actions can queue 10-25 min past the cron fire time).
          if now.weekday() < 5 and 855 <= t <= 959:
              result = subprocess.run(
                  [sys.executable, "dman_algo.py", "--mode", "premarket"],
                  capture_output=False
              )
              sys.exit(result.returncode)

          # 4:00 PM ET EOD P&L summary.
          # Must be checked BEFORE the market-hours gate below because GitHub
          # Actions runners often queue 3-10 min past cron fire time — by the
          # time Python runs it's 4:03-4:08 PM (t=1603-1608) and the strict
          # t<=1600 guard would silently exit, which is why P&L never arrived.
          # Window: 3:55 PM – 4:20 PM ET to absorb all realistic queue delays.
          if now.weekday() < 5 and 1555 <= t <= 1620:
              result = subprocess.run(
                  [sys.executable, "dman_algo.py", "--mode", "pnl"],
                  capture_output=False
              )
              sys.exit(result.returncode)

          if now.weekday() >= 5 or not (930 <= t <= 1600):
              print(f"Market closed ({now.strftime('%a %H:%M ET')}) — skipping scan.")
              sys.exit(0)
          # Daily watchlist fires on the 9:45 AM scan (first scan of the day)
          if 945 <= t <= 1005:
              subprocess.run(
                  [sys.executable, "dman_algo.py", "--mode", "watchlist"],
                  capture_output=False
              )
          # Before 10 AM: curated universe only — fast, catches gap-and-holds at gate open.
          # After 10 AM: full universe for momentum continuation plays.
          universe = "curated" if t < 1000 else "all"
          result = subprocess.run(
              [sys.executable, "dman_algo.py", "--mode", "scan",
               "--universe", universe, "--ai", "--submit"],
              capture_output=False
          )
          # 10 AM–3:30 PM: run momentum watch alongside the main scan.
          # Detects breakout setups forming + exit/trail signals on open positions.
          # Options positions have no broker-side exit — they rely entirely on this
          # loop for T1/T2 alerts. Must run through the full session, not just open.
          if 1000 <= t <= 1600:
              subprocess.run(
                  [sys.executable, "dman_algo.py", "--mode", "momentum-watch"],
                  capture_output=False
              )
          sys.exit(result.returncode)
          EOF

      - name: Persist alert cache and live signal logs
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add dman_last_alerts.json dman_live_signals.json dman_live_outcomes.csv \
                  dman_alpaca_sync.json \
                  dman_win_rate.json dman_monthly_pnl.json dman_daily_pnl.json \
                  dman_scan_log.json dman_universe_cache.json \
                  dman_stocktwits_seen.json || true
          if git diff --staged --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "chore: update alert/signal cache [skip ci]"
          # Fetch and rebase on latest remote before pushing (handles concurrent commits)
          git fetch origin main
          if ! git rebase origin/main; then
            echo "Rebase conflict on data files — taking ours and continuing"
            git checkout --ours -- dman_last_alerts.json dman_live_signals.json \
              dman_live_outcomes.csv dman_alpaca_sync.json dman_win_rate.json \
              dman_monthly_pnl.json dman_daily_pnl.json dman_scan_log.json \
              dman_universe_cache.json dman_stocktwits_seen.json 2>/dev/null || true
            git add -u
            git rebase --continue || git rebase --abort
          fi
          # Try push; if rejected (race), fetch-rebase-push once more
          if ! git push origin HEAD:main; then
            echo "First push rejected — refetching and retrying"
            git fetch origin main
            git rebase origin/main || git rebase --abort
            git push origin HEAD:main || echo "ERROR: data push failed after retry — check branch protection rules"
          fi

      - name: Notify on workflow failure
        if: failure()
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Only fires for pre-Python failures (checkout/install) — Python crashes
          # send their own detailed 🚨 message and exit 1, so this is a safety net only.
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=⚠️ <b>DMan scan FAILED</b> — pre-run step failed (checkout/install). Check GitHub Actions." \
            -d "parse_mode=HTML" || true
