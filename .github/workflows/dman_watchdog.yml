name: DMan Watchdog

# Independent health check, deliberately decoupled from both the scanner and
# daemon workflows so a failure in either doesn't also take down the thing
# watching them. Catches two failure classes:
#   1. Hard failures — the most recent Scanner/Daemon run reported "failure"
#   2. SILENT failures — a run reports "success" but produced no real work
#      (e.g. the daemon's missing `import json` bug: the workflow kept
#      reporting green for a full day while every state sync failed
#      internally — a conclusion check alone would have missed it)
# See run_watchdog() in dman_algo.py for the actual check logic.

on:
  schedule:
    # Every 30 min, 9:00 AM - 4:00 PM ET (13:00-20:00 UTC), weekdays.
    # The function itself no-ops outside 9:30-4:00 for the freshness checks
    # (only the hard-failure check runs outside that window) and skips
    # entirely on weekends.
    #
    # Offset to :07/:37 (was :00/:30) — confirmed live 2026-08-03: GitHub's
    # own docs warn "the schedule event can be delayed during periods of
    # high load... high load times include the start of every hour" and
    # recommend a different minute. This is the ONE workflow where that
    # mattered most: the watchdog only fired 4 times that day instead of
    # the expected ~14 (every :00/:30 slot competing with every other
    # GitHub-wide job that also defaults to the hour/half-hour), which is
    # exactly the self-heal mechanism that's supposed to catch everything
    # else being delayed. A same-hour offset (still every 30 min, same
    # coverage) costs nothing and lands in a quieter part of the queue.
    - cron: '7,37 13-20 * * 1-5'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # persists the alert-dedup file so the 30-min cooldown works across runs
      actions: write    # lets the watchdog auto-restart a stuck daemon (see _trigger_workflow_restart)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Run watchdog
        env:
          TELEGRAM_TOKEN:      ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          PYTHONIOENCODING:    utf-8
        run: python dman_algo.py --mode watchdog

      - name: Persist alert-dedup cache
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          [ -f dman_last_alerts.json ] && git add dman_last_alerts.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: watchdog alert cache [skip ci]"
          git fetch origin main
          # Confirmed live 2026-08-07 (dman_scanner.yml): a stray uncommitted
          # change can appear between a commit and the rebase right after it,
          # causing "cannot rebase: You have unstaged changes" -- a
          # precondition failure the conflict-recovery path below has
          # nothing to recover from ("no rebase in progress"), killing the
          # step outright. Absorbing any stray change first keeps the
          # working tree clean going into the rebase.
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git add -A
            git commit -m "chore: absorb stray state change [skip ci]" || true
          fi
          if ! git rebase origin/main; then
            [ -f dman_last_alerts.json ] && git checkout --theirs -- dman_last_alerts.json 2>/dev/null
            git add -u
            git rebase --continue || git rebase --abort
          fi
          git push origin HEAD:main || echo "Warning: push skipped — will sync next run"
