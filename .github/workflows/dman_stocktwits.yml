name: DMan StockTwits Monitor

on:
  schedule:
    # Every 10 min, 7 AM - 4 PM ET (11:00-20:00 UTC), weekdays. Tightened
    # from every 2 hours (2026-08-07, direct instruction to hunt faster) —
    # confirmed live 2026-08-06 that the 2hr cadence was a real cost: by
    # the time a DMan call got picked up and traded, the initial spike had
    # already partially unwound (CLRO entered 14.4% off a high set well
    # before the next 2hr poll would even have run). A 10-min cadence is
    # the tightest useful step under GitHub's 5-min scheduling floor
    # without spamming — the immediate-dispatch fix (see the commit step
    # below) still does the real latency-closing work per-detection; this
    # just means detection itself no longer waits up to 2 hours to fire.
    - cron: '*/10 11-20 * * 1-5'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  stocktwits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write   # lets a new DMan call dispatch an immediate scan instead of waiting for the next hourly cron

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Monitor StockTwits
        env:
          TELEGRAM_TOKEN:      ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          APCA_API_KEY_ID:     ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          ACCOUNT_SIZE:        ${{ secrets.ACCOUNT_SIZE }}
          PYTHONIOENCODING:    utf-8
        run: python dman_algo.py --mode stocktwits

      - name: Commit new tickers and seen cache
        id: commit
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add dman_stocktwits_seen.json dman_smallcap_watchlist.json || true
          if git diff --staged --quiet; then
            echo "No StockTwits changes to commit"
            echo "watchlist_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A new ticker call is the signal worth acting on immediately below —
          # the seen-cache alone (no watchlist change) doesn't need a scan.
          if git diff --staged --name-only | grep -q dman_smallcap_watchlist.json; then
            echo "watchlist_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "watchlist_changed=false" >> "$GITHUB_OUTPUT"
          fi
          git commit -m "feat: auto-add DMan StockTwits calls to watchlist data file [skip ci]"
          git fetch origin main
          # Confirmed live 2026-08-07 (dman_scanner.yml): a stray uncommitted
          # change can appear between a commit and the rebase right after it,
          # causing "cannot rebase: You have unstaged changes" -- a
          # precondition failure the conflict-recovery path below has
          # nothing to recover from ("no rebase in progress"), killing the
          # step outright. Absorbing any stray change first keeps the
          # working tree clean going into the rebase.
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git add -A
            git commit -m "chore: absorb stray state change [skip ci]" || true
          fi
          if ! git rebase origin/main; then
            # `git rebase` reverses --ours/--theirs vs `git merge`: "ours" is
            # the upstream commit being rebased ONTO, "theirs" is our own new
            # commit. This was `--ours` and silently discarded newly-added
            # tickers on conflict — verified by direct reproduction.
            echo "Rebase conflict — keeping our watchlist additions and seen cache (theirs, during rebase)"
            git checkout --theirs -- dman_smallcap_watchlist.json dman_stocktwits_seen.json 2>/dev/null || true
            git add dman_smallcap_watchlist.json dman_stocktwits_seen.json
            git rebase --continue || git rebase --abort
          fi
          if ! git push origin HEAD:main; then
            git fetch origin main
            if ! git diff --quiet || ! git diff --staged --quiet; then
              git add -A
              git commit -m "chore: absorb stray state change [skip ci]" || true
            fi
            git rebase origin/main || git rebase --abort
            git push origin HEAD:main || echo "ERROR: StockTwits push failed after retry"
          fi

      - name: Trigger immediate scan for the new call(s)
        # Without this, a new DMan call sits in the watchlist file for up to
        # ~1hr (next hourly scanner cron) before the algo ever evaluates it —
        # the exact "notifications but nothing committed" gap. Explicitly
        # picks the mode input rather than dispatching bare: an input-less
        # dispatch at our own 9 AM ET run would land in dman_scanner.yml's
        # 8:55-9:59 AM read-only briefing fallback window every time, never
        # actually evaluating/submitting the new ticker. This mirrors that
        # same file's own time-of-day routing (pre-open -> premarket-early's
        # moonshot auto-submit, market-hours -> real --submit scan) so no new
        # trading logic is added here — just the immediate trigger.
        if: steps.commit.outputs.watchlist_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'EOF'
          import os, json, urllib.request, zoneinfo
          from datetime import datetime
          ET = zoneinfo.ZoneInfo("America/New_York")
          now = datetime.now(ET)
          t = now.hour * 100 + now.minute
          if now.weekday() >= 5 or t < 650 or t > 1600:
              print(f"Outside trading window ({now:%a %H:%M} ET) — next scheduled cron covers it, skipping immediate dispatch")
              raise SystemExit(0)
          mode = "premarket-early" if t < 930 else "scan"
          req = urllib.request.Request(
              "https://api.github.com/repos/tsingh08/dman-algo-/actions/workflows/dman_scanner.yml/dispatches",
              data=json.dumps({"ref": "main", "inputs": {"mode": mode}}).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  print(f"Dispatched immediate scan (mode={mode}) — status {resp.status}")
          except Exception as e:
              print(f"Scan dispatch failed (non-fatal — hourly cron still covers it): {e}")
          EOF
