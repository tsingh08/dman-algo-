name: DMan StockTwits Monitor

on:
  schedule:
    # Every 2 hours 7 AM – 4 PM ET (11:00–20:00 UTC), weekdays
    - cron: '0 11,13,15,17,19 * * 1-5'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  stocktwits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Monitor StockTwits
        env:
          TELEGRAM_TOKEN:      ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          APCA_API_KEY_ID:     ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          ACCOUNT_SIZE:        ${{ secrets.ACCOUNT_SIZE }}
          PYTHONIOENCODING:    utf-8
        run: python dman_algo.py --mode stocktwits

      - name: Persist seen-ticker cache
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add dman_stocktwits_seen.json || true
          git diff --staged --quiet && echo "No changes to commit" || (
            git commit -m "chore: update StockTwits seen cache [skip ci]" &&
            git pull --rebase origin main &&
            git push origin HEAD:main
          ) || echo "Warning: cache push skipped — will sync next run"
