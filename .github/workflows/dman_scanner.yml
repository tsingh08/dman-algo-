name: DMan PRO Scanner

on:
  schedule:
    # Sunday 5 PM ET — weekly readiness check, shows which watchlist tickers
    # pass all pre-gap filters heading into Monday
    - cron: '0 21 * * 0'
    # 9:00 AM ET — pre-market briefing: regime, macro calendar, live gaps, fade-risk,
    # sector health, scanner watchdog. Runs before market open so fast_info returns
    # actual pre-market prices, not intraday prices.
    - cron: '0 13 * * 1-5'
    # 9:45 AM ET — dedicated Gap & Hold scan, fires exactly when the early-session
    # gate opens. 13:30 UTC (9:30 AM) is peak GitHub runner contention (all trading
    # bots hit at once); 13:45 UTC is 15 min quieter and the Gate is already open.
    - cron: '45 13 * * 1-5'
    # Hourly 10:30 AM – 3:30 PM ET for momentum continuation + new setups
    - cron: '30 14,15,16,17,18,19 * * 1-5'
    # 4:00 PM ET final check / Friday close-out advisory
    - cron: '0 20 * * 1-5'
  workflow_dispatch:   # manual trigger from GitHub UI

# Only one scan runs at a time — queues instead of running concurrently.
# Prevents git push conflicts when a scan takes longer than 30 min.
concurrency:
  group: dman-scan
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write   # needed to push alert cache back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Run DMan PRO Scanner
        env:
          TELEGRAM_TOKEN:      ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          ACCOUNT_SIZE:        ${{ secrets.ACCOUNT_SIZE }}
          APCA_API_KEY_ID:     ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          PYTHONIOENCODING:    utf-8
        run: |
          python - <<'EOF'
          from datetime import datetime, date
          import zoneinfo, sys, subprocess
          ET = zoneinfo.ZoneInfo("America/New_York")
          now = datetime.now(ET)
          today = now.date()
          t = now.hour * 100 + now.minute

          # Sunday 5 PM ET — weekly readiness check for Monday gaps
          if now.weekday() == 6:
              result = subprocess.run(
                  [sys.executable, "dman_algo.py", "--mode", "readiness"],
                  capture_output=False
              )
              sys.exit(result.returncode)

          # NYSE market holidays — market closed, nothing to scan
          MARKET_HOLIDAYS = {
              date(2025,  1,  1), date(2025,  1, 20), date(2025,  2, 17),
              date(2025,  4, 18), date(2025,  5, 26), date(2025,  6, 19),
              date(2025,  7,  4), date(2025,  9,  1), date(2025, 11, 27),
              date(2025, 12, 25),
              date(2026,  1,  1), date(2026,  1, 19), date(2026,  2, 16),
              date(2026,  4,  3), date(2026,  5, 25), date(2026,  6, 19),
              date(2026,  7,  3), date(2026,  9,  7), date(2026, 11, 26),
              date(2026, 12, 25),
              date(2027,  1,  1), date(2027,  1, 18), date(2027,  2, 15),
              date(2027,  3, 26), date(2027,  5, 31), date(2027,  6, 18),
              date(2027,  7,  5), date(2027,  9,  6), date(2027, 11, 25),
              date(2027, 12, 24),
          }
          if today in MARKET_HOLIDAYS:
              print(f"NYSE holiday ({now.strftime('%a %b %d')}) — market closed, skipping scan.")
              sys.exit(0)

          # 9:00 AM ET — pre-market briefing (before regular session opens).
          # Must be checked before the 930-1600 market-hours guard below.
          # Window extends to 9:59 AM to absorb runner queue delays (peak-hour
          # GitHub Actions can queue 10-25 min past the cron fire time).
          if now.weekday() < 5 and 855 <= t <= 959:
              result = subprocess.run(
                  [sys.executable, "dman_algo.py", "--mode", "premarket"],
                  capture_output=False
              )
              sys.exit(result.returncode)

          if now.weekday() >= 5 or not (930 <= t <= 1600):
              print(f"Market closed ({now.strftime('%a %H:%M ET')}) — skipping scan.")
              sys.exit(0)
          # Daily watchlist fires on the 9:45 AM scan (first scan of the day)
          if 945 <= t <= 1005:
              subprocess.run(
                  [sys.executable, "dman_algo.py", "--mode", "watchlist"],
                  capture_output=False
              )
          # Before 10 AM: curated universe only — fast, catches gap-and-holds at gate open.
          # After 10 AM: full universe for momentum continuation plays.
          universe = "curated" if t < 1000 else "all"
          result = subprocess.run(
              [sys.executable, "dman_algo.py", "--mode", "scan",
               "--universe", universe, "--ai", "--submit"],
              capture_output=False
          )
          sys.exit(result.returncode)
          EOF

      - name: Persist alert cache and live signal logs
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add dman_last_alerts.json dman_live_signals.json dman_live_outcomes.csv \
                  dman_positions.json dman_alpaca_sync.json \
                  dman_win_rate.json dman_monthly_pnl.json dman_daily_pnl.json \
                  dman_scan_log.json || true
          git diff --staged --quiet && echo "No changes to commit" || (
            git commit -m "chore: update alert/signal cache [skip ci]" &&
            git push origin HEAD:main --force-with-lease
          ) || echo "Warning: cache push skipped — will sync next scan"

      - name: Notify on workflow failure
        if: failure()
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Only fires for pre-Python failures (checkout/install) — Python crashes
          # send their own detailed 🚨 message and exit 1, so this is a safety net only.
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=⚠️ <b>DMan scan FAILED</b> — pre-run step failed (checkout/install). Check GitHub Actions." \
            -d "parse_mode=HTML" || true
