name: CI — syntax and data checks

# Catches a broken dman_algo.py BEFORE it takes down all scheduled trading jobs.
# Data-cache commits use [skip ci] so this only runs on real code changes.
on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Syntax check
        run: python -m py_compile dman_algo.py

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Import check (catches module-level NameErrors, bad constants)
        env:
          PYTHONIOENCODING: utf-8
        run: python -c "import dman_algo; print('dman_algo imports cleanly')"

      - name: Static check — undefined names inside functions
        # The import check above only catches NAMES EVALUATED AT IMPORT.
        # A NameError inside a function body only fires when that line runs,
        # and if the line sits in a try/except it never surfaces at all.
        # Found 2026-09-13: an undefined AssetClass had silently switched
        # PORTFOLIO_HEAT_LIMIT off (the NameError was swallowed every scan),
        # and an undefined size_strangle_trade killed every strangle advisory.
        # pyflakes reads every line without running it, so both would have
        # failed this build the day they were introduced.
        run: |
          pip install pyflakes >/dev/null
          OUT=$(python -m pyflakes dman_algo.py dman_daemon.py 2>&1 | grep -E "undefined name|is used before assignment" || true)
          if [ -n "$OUT" ]; then
            echo "$OUT"
            echo "::error::undefined names found — these are latent NameErrors"
            exit 1
          fi
          echo "no undefined names"

      - name: Golden characterization harnesses (order + exit logic)
        # Replays the order function and the options exit logic through fixed,
        # hermetic scenarios and compares every order, Telegram message,
        # tracker write and printed line to a committed baseline. Built for the
        # 2026-09-14 refactor of the two most complex money paths. A DIFF here
        # means behaviour changed: if that was intended, re-record with
        #   python golden/<harness>.py record
        # and commit the new .golden.json alongside the change.
        run: |
          python golden/submit_signals_harness.py check | tee /tmp/g1.txt
          python golden/monitor_option_harness.py check | tee /tmp/g2.txt
          python golden/callee_harness.py telegram check | tee /tmp/g3.txt
          grep -q "GOLDEN: IDENTICAL" /tmp/g1.txt && grep -q "GOLDEN: IDENTICAL" /tmp/g2.txt && grep -q "GOLDEN: IDENTICAL" /tmp/g3.txt

      - name: Regression suite (test_dman_algo.py)
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest test_dman_algo -v

      - name: Validate JSON data files
        run: |
          python - <<'EOF'
          import json, glob, sys
          bad = []
          for p in glob.glob("dman_*.json"):
              try:
                  with open(p, encoding="utf-8") as f:
                      json.load(f)
              except Exception as e:
                  bad.append(f"{p}: {e}")
          if bad:
              print("INVALID JSON:\n" + "\n".join(bad))
              sys.exit(1)
          print(f"All {len(glob.glob('dman_*.json'))} JSON data files valid")
          EOF

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=🚨 <b>CI FAILED</b> — dman_algo.py is broken on main. All trading jobs will fail until fixed. Check GitHub Actions now." \
            -d "parse_mode=HTML" || true
