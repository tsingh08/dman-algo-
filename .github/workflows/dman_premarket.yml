name: DMan PRO Pre-Market Briefing

on:
  schedule:
    # Target 8:10 AM ET pre-market briefing.
    # Fire at 12:10 UTC (1h before market-hours GitHub rush at 13:30 UTC) so
    # the job runs quickly instead of sitting in queue for 2-4 hours.
    # EDT (Mar–Nov): 12:10 UTC = 8:10 AM ET / 6:10 AM MDT
    # EST (Nov–Mar): 12:10 UTC = 7:10 AM ET / 5:10 AM MST  ← acceptable early
    - cron: '10 12 * * 1-5'
  workflow_dispatch:   # manual trigger for testing

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: dman-premarket
  cancel-in-progress: false

jobs:
  premarket:
    runs-on: ubuntu-latest
    # 15 -> 30: dispatched before 8:00 ET the briefing waits up to 12 min, then
    # runs 8-10; at 15 the timeout would kill it before its last step, which now
    # starts the trading daemon.
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write    # dispatch the trading daemon ahead of the open (last step)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Run Pre-Market Briefing
        env:
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BENZINGA_API_KEY:  ${{ secrets.BENZINGA_API_KEY }}
          MASSIVE_API_KEY:          ${{ secrets.MASSIVE_API_KEY }}
          MASSIVE_NEWS_API_KEY:     ${{ secrets.MASSIVE_NEWS_API_KEY }}
          MASSIVE_EARNINGS_API_KEY: ${{ secrets.MASSIVE_EARNINGS_API_KEY }}
          BENZINGA_EARNING_API_KEY: ${{ secrets.BENZINGA_EARNING_API_KEY }}
          PYTHONIOENCODING:  utf-8
          EVENT_NAME:        ${{ github.event_name }}
        run: |
          python - <<'EOF'
          from datetime import datetime, timedelta
          import zoneinfo, sys, subprocess, time
          ET = zoneinfo.ZoneInfo("America/New_York")
          now = datetime.now(ET)
          if now.weekday() >= 5:
              print(f"Weekend ({now.strftime('%a')}) — skipping briefing.")
              sys.exit(0)
          # If GitHub ran this early (before 8:00 AM ET), wait up to 12 min.
          # If it's still before 7:30 AM ET after waiting, skip — GitHub is
          # running the job far too early (rare) and we'll catch it next time.
          target_hhmm = 800   # 8:00 AM ET
          cur_hhmm    = now.hour * 100 + now.minute
          if cur_hhmm < 730:
              print(f"Too early ({now.strftime('%H:%M ET')}) — GitHub ran job ahead of schedule. Skipping.")
              sys.exit(0)
          # GitHub's scheduler has been starting this job ~4 hours late every
          # day (12:21, 12:56, 12:49, 12:55 PM ET the week of 2026-09-14). The
          # scanner workflow dispatches the briefing at ~8:20 AM as a backstop,
          # and THAT is the briefing that arrives in time; the late scheduled
          # run then sent a second "pre-market" briefing hours after the open.
          # Scheduled runs only -- a manual dispatch always runs.
          import os
          if os.environ.get("EVENT_NAME") == "schedule" and cur_hhmm >= 925:
              print(f"Too late ({now.strftime('%H:%M ET')}) — GitHub delayed this past the open; "
                    "the 8:20 dispatch already delivered today's briefing. Skipping.")
              sys.exit(0)
          if cur_hhmm < target_hhmm:
              wait_s = (target_hhmm // 100 * 60 + target_hhmm % 100 - now.hour * 60 - now.minute) * 60
              wait_s = min(wait_s, 12 * 60)  # cap at 12 min (stay under step timeout)
              print(f"Waiting {wait_s}s for 8:00 AM ET...")
              time.sleep(wait_s)
          result = subprocess.run(
              [sys.executable, "dman_algo.py", "--mode", "premarket"],
              capture_output=False
          )
          sys.exit(result.returncode)
          EOF

      # Start the trading daemon from here. Its own 9:23 cron has fired hours
      # late (11:55 AM on 2026-08-03; a watchdog dispatch at 9:36 on
      # 2026-09-21), and this briefing is the one run that reliably lands
      # before the open. The daemon holds until 9:10 ET when dispatched early,
      # and shares a cancel-in-progress group with its scheduled runs, so if
      # the 9:23 cron does fire on time it replaces this one -- never two.
      - name: Make sure the trading daemon is up for the open
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          hhmm=$(TZ=America/New_York date +%H%M); dow=$(TZ=America/New_York date +%u)
          if [ "$dow" -gt 5 ] || [ "$hhmm" -lt 0730 ] || [ "$hhmm" -ge 0910 ]; then
            echo "Outside the 7:30-9:10 ET weekday window ($hhmm) — leaving the daemon to its own schedule."
            exit 0
          fi
          active=$(gh run list -R "$GITHUB_REPOSITORY" --workflow dman_daemon.yml --limit 10 \
                   --json status -q '[.[] | select(.status=="in_progress" or .status=="queued")] | length')
          if [ "${active:-0}" -gt 0 ]; then
            echo "A daemon run is already active — not dispatching another."
            exit 0
          fi
          gh workflow run dman_daemon.yml -R "$GITHUB_REPOSITORY" --ref main
          echo "Daemon dispatched at $hhmm ET — it will hold until 9:10 and run the morning session."
