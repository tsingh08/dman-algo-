name: DMan PRO Scanner

on:
  schedule:
    # Every 60 min, 13:30–20:00 UTC = 9:30am–4:00pm EDT (market hours)
    # Gap & Hold that holds 60+ min is higher quality than 30 min
    - cron: '30 13,14,15,16,17,18,19 * * 1-5'
    - cron: '0 20 * * 1-5'
  workflow_dispatch:   # manual trigger from GitHub UI

# Only one scan runs at a time — queues instead of running concurrently.
# Prevents git push conflicts when a scan takes longer than 30 min.
concurrency:
  group: dman-scan
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write   # needed to push alert cache back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Run DMan PRO Scanner
        env:
          TELEGRAM_TOKEN:      ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          ACCOUNT_SIZE:        ${{ secrets.ACCOUNT_SIZE }}
          APCA_API_KEY_ID:     ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          PYTHONIOENCODING:    utf-8
        run: |
          python - <<'EOF'
          from datetime import datetime
          import zoneinfo, sys, subprocess
          ET = zoneinfo.ZoneInfo("America/New_York")
          now = datetime.now(ET)
          t = now.hour * 100 + now.minute
          if now.weekday() >= 5 or not (930 <= t <= 1600):
              print(f"Market closed ({now.strftime('%a %H:%M ET')}) — skipping scan.")
              sys.exit(0)
          # Daily watchlist at market open (9:30–9:50 AM ET) — sent before the main scan
          # The scan itself also triggers it, but this ensures it runs even on slow scan days
          if 930 <= t <= 950:
              subprocess.run(
                  [sys.executable, "dman_algo.py", "--mode", "watchlist"],
                  capture_output=False
              )
          # First 30 min: use curated universe (fast, no NASDAQ fetch, catches gap-and-holds).
          # After 10 AM: expand to full universe for momentum continuation plays.
          universe = "curated" if t < 1000 else "all"
          result = subprocess.run(
              [sys.executable, "dman_algo.py", "--mode", "scan",
               "--universe", universe, "--ai", "--submit"],
              capture_output=False
          )
          sys.exit(result.returncode)
          EOF

      - name: Persist alert cache and live signal logs
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add dman_last_alerts.json dman_live_signals.json dman_live_outcomes.csv \
                  dman_positions.json dman_alpaca_sync.json \
                  dman_win_rate.json dman_monthly_pnl.json dman_daily_pnl.json \
                  dman_scan_log.json || true
          git diff --staged --quiet && echo "No changes to commit" || (
            git commit -m "chore: update alert/signal cache [skip ci]" &&
            git push origin HEAD:main --force-with-lease
          ) || echo "Warning: cache push skipped — will sync next scan"

      - name: Notify on workflow failure
        if: failure()
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=⚠️ <b>DMan scan FAILED</b> — check GitHub Actions" \
            -d "parse_mode=HTML" || true
