name: DMan PRO Pre-Market Briefing

on:
  schedule:
    # Target 8:10 AM ET pre-market briefing.
    # Fire at 12:10 UTC (1h before market-hours GitHub rush at 13:30 UTC) so
    # the job runs quickly instead of sitting in queue for 2-4 hours.
    # EDT (Mar–Nov): 12:10 UTC = 8:10 AM ET / 6:10 AM MDT
    # EST (Nov–Mar): 12:10 UTC = 7:10 AM ET / 5:10 AM MST  ← acceptable early
    - cron: '10 12 * * 1-5'
  workflow_dispatch:   # manual trigger for testing

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: dman-premarket
  cancel-in-progress: false

jobs:
  premarket:
    runs-on: ubuntu-latest
    # 15 -> 30: dispatched before 8:00 ET the briefing waits up to 12 min, then
    # runs 8-10; at 15 the timeout would kill it before its last step, which now
    # starts the trading daemon.
    # 30 -> 45. The briefing's last step (8/8) pre-builds the full RVOL scan
    # universe, measured at ~8.5 minutes on its own, and the step above it can
    # sleep up to 12 minutes waiting for 8:00 AM ET -- so the real budget was
    # about 15 minutes for eight sections plus a build. A JOB-level timeout is
    # not survivable the way a step failure is: GitHub skips `if: always()`
    # steps when the job itself is killed, which would take out both the state
    # persist AND the daemon dispatch below -- the step that guarantees the
    # daemon is up for the open.
    #
    # 45 -> 75. The wait-for-8:00 cap below went from 12 to 45 minutes so the
    # briefing still lands at 8:00 ET after daylight saving ends, when its
    # trigger fires at 07:20 EST. 45 (wait) + ~20 (briefing) + the persist and
    # dispatch steps does not fit inside 45.
    timeout-minutes: 75
    permissions:
      # write, not read: this job BUILDS the 500-ticker scan universe for the
      # 9:45 Gap & Hold gate and had no way to save it. See the persist step.
      contents: write
      actions: write    # dispatch the trading daemon ahead of the open (last step)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Run Pre-Market Briefing
        env:
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BENZINGA_API_KEY:  ${{ secrets.BENZINGA_API_KEY }}
          MASSIVE_API_KEY:          ${{ secrets.MASSIVE_API_KEY }}
          MASSIVE_NEWS_API_KEY:     ${{ secrets.MASSIVE_NEWS_API_KEY }}
          MASSIVE_EARNINGS_API_KEY: ${{ secrets.MASSIVE_EARNINGS_API_KEY }}
          BENZINGA_EARNING_API_KEY: ${{ secrets.BENZINGA_EARNING_API_KEY }}
          PYTHONIOENCODING:  utf-8
          EVENT_NAME:        ${{ github.event_name }}
        run: |
          python - <<'EOF'
          from datetime import datetime, timedelta
          import zoneinfo, sys, subprocess, time
          ET = zoneinfo.ZoneInfo("America/New_York")
          now = datetime.now(ET)
          if now.weekday() >= 5:
              print(f"Weekend ({now.strftime('%a')}) — skipping briefing.")
              sys.exit(0)
          # If this ran early (before 8:00 AM ET) it waits for 8:00, capped at
          # 45 min (see the cap below). A SCHEDULED run still before 7:30 AM ET
          # is skipped outright — GitHub started it far too early.
          target_hhmm = 800   # 8:00 AM ET
          cur_hhmm    = now.hour * 100 + now.minute
          import os
          # Scheduled runs only. A DISPATCH always runs: the cloud routine that
          # dispatches this briefing is pinned to 12:20 UTC, which is 8:20 ET in
          # summer but 7:20 ET after daylight saving ends (Nov 1) -- skipping it
          # then would mean no briefing and no daemon start from November on.
          # Dispatched early, it waits toward 8:00 below (capped at 45 min,
          # which covers the 07:20 EST case).
          if cur_hhmm < 730 and os.environ.get("EVENT_NAME") == "schedule":
              print(f"Too early ({now.strftime('%H:%M ET')}) — GitHub ran job ahead of schedule. Skipping.")
              sys.exit(0)
          # GitHub's scheduler has been starting this job ~4 hours late every
          # day (12:21, 12:56, 12:49, 12:55 PM ET the week of 2026-09-14). The
          # scanner workflow dispatches the briefing at ~8:20 AM as a backstop,
          # and THAT is the briefing that arrives in time; the late scheduled
          # run then sent a second "pre-market" briefing hours after the open.
          # Scheduled runs only -- a manual dispatch always runs.
          import os
          if os.environ.get("EVENT_NAME") == "schedule" and cur_hhmm >= 925:
              print(f"Too late ({now.strftime('%H:%M ET')}) — GitHub delayed this past the open; "
                    "the 8:20 dispatch already delivered today's briefing. Skipping.")
              sys.exit(0)
          if cur_hhmm < target_hhmm:
              wait_s = (target_hhmm // 100 * 60 + target_hhmm % 100 - now.hour * 60 - now.minute) * 60
              # 12 -> 45 min. The cloud routine that actually triggers this
              # fires at 12:20 UTC, which is 08:20 EDT but 07:20 EST. With a
              # 12-minute cap the winter run started the briefing at 07:32 --
              # 28 minutes before target, building the 9:45 gate's scan
              # universe on pre-market volume that has barely printed, and
              # leaving two minutes of margin before the daemon-dispatch step
              # below will even consider running (its window opens at 07:30).
              #
              # 45 minutes covers 07:20 -> 08:00 in either clock, so the
              # briefing runs at its intended 8:00 ET year round. Nothing
              # changes in EDT: the dispatch already lands at 08:20, past
              # target, so there is no wait at all. The job timeout above was
              # raised to match.
              wait_s = min(wait_s, 45 * 60)
              print(f"Waiting {wait_s}s for 8:00 AM ET...")
              time.sleep(wait_s)
          result = subprocess.run(
              [sys.executable, "dman_algo.py", "--mode", "premarket"],
              capture_output=False
          )
          sys.exit(result.returncode)
          EOF

      # The briefing's last step builds the full ~500-ticker RVOL universe so
      # the 9:45 Gap & Hold gate can load it instead of falling back to the
      # ~49-name curated watchlist. Nothing saved it: this workflow had no
      # commit step at all, so every run built that universe and threw it away
      # when the runner ended.
      #
      # The cache still looked fresh in the repo, which is why this went
      # unnoticed -- dman_scanner.yml's 8:55-9:59 ET "rare fallback" briefing
      # has in fact been firing every single day and committing it at 09:46
      # and 09:56 ET. One minute AFTER the 9:45 gate it exists to serve. So at
      # 9:45 the committed copy still carried YESTERDAY's date, failed
      # main()'s `_cache_date == _today_str` check, and the highest-volume
      # setup in the system scanned ~49 names instead of ~500. Every day.
      #
      # Only this one file: it is written by exactly one function
      # (run_premarket_briefing), so there is no writer to race with. The
      # multi-writer state files stay with the daemon and scanner, which run
      # --mode merge-positions first for semantic merging; this job does not.
      # Naming one file in `files:` below does NOT mean one file gets pushed.
      # persist-state absorbs stray uncommitted changes with `git add -A`
      # before it rebases, and the briefing also writes dman_positions.json
      # (the fill re-anchor calls _save()), dman_last_alerts.json and others.
      # Pushing those straight from this runner's checkout would skip the
      # semantic merge that protects them -- merge_positions_snapshots() exists
      # because a blind file-level resolution can silently drop whichever side
      # did more protective work (a raised stop, a partial sale already taken).
      # The scanner and daemon both merge before they persist; this job has to
      # as well, now that it persists at all.
      - name: Merge state against remote before persisting
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin main
          python dman_algo.py --mode merge-positions || true

      - name: Persist the pre-built scan universe
        if: always()
        uses: ./.github/actions/persist-state
        with:
          files: dman_universe_cache.json
          commit_message: 'chore: pre-built scan universe for the 9:45 gate [skip ci]'

      # This job PUSHES now (see the persist step above) and had no failure
      # path at all, so a red run -- a bad rebase, a permissions change, a
      # crashed briefing -- was visible only to someone who thought to open
      # the Actions tab. Every other scheduled workflow here notifies.
      - name: Notify on workflow failure
        if: failure()
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=🚨 <b>Pre-market briefing FAILED</b> — today's briefing did not complete. The 9:45 gate will fall back to the curated watchlist, and the daemon may not have been dispatched. Check GitHub Actions." \
            -d "parse_mode=HTML" || true

      # Start the trading daemon from here. Its own 9:23 cron has fired hours
      # late (11:55 AM on 2026-08-03; a watchdog dispatch at 9:36 on
      # 2026-09-21), and this briefing is the one run that reliably lands
      # before the open. The daemon holds until 9:10 ET when dispatched early,
      # and shares a cancel-in-progress group with its scheduled runs, so if
      # the 9:23 cron does fire on time it replaces this one -- never two.
      - name: Make sure the trading daemon is up for the open
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          hhmm=$(TZ=America/New_York date +%H%M); dow=$(TZ=America/New_York date +%u)
          if [ "$dow" -gt 5 ] || [ "$hhmm" -lt 0730 ] || [ "$hhmm" -ge 0910 ]; then
            echo "Outside the 7:30-9:10 ET weekday window ($hhmm) — leaving the daemon to its own schedule."
            exit 0
          fi
          active=$(gh run list -R "$GITHUB_REPOSITORY" --workflow dman_daemon.yml --limit 10 \
                   --json status -q '[.[] | select(.status=="in_progress" or .status=="queued")] | length')
          if [ "${active:-0}" -gt 0 ]; then
            echo "A daemon run is already active — not dispatching another."
            exit 0
          fi
          # Dispatch, then CONFIRM GitHub picked the run up -- a dispatch that
          # silently never starts would leave the day untraded with nothing
          # said. Retry once; only if that also fails, tell the user.
          confirmed() {
            for i in 1 2 3 4 5 6 7 8 9; do
              sleep 10
              n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow dman_daemon.yml --limit 5                     --json status,event -q '[.[] | select(.event=="workflow_dispatch" and
                    (.status=="in_progress" or .status=="queued"))] | length')
              [ "${n:-0}" -gt 0 ] && return 0
            done
            return 1
          }
          for attempt in 1 2; do
            gh workflow run dman_daemon.yml -R "$GITHUB_REPOSITORY" --ref main || true
            if confirmed; then
              echo "Daemon run confirmed (attempt $attempt) at $hhmm ET — it holds until 9:10, then runs the morning session."
              exit 0
            fi
            echo "Daemon run not confirmed on attempt $attempt"
          done
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage"             -d "chat_id=${TELEGRAM_CHAT_ID}" -d "parse_mode=HTML"             --data-urlencode "text=⚠️ <b>Trading session did not start</b> — two dispatches were not picked up by GitHub. Send /restart, or it starts on its own schedule (often hours late)." || true
          exit 1
