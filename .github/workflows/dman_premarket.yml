name: DMan PRO Pre-Market Briefing

on:
  schedule:
    # Target 8:10 AM ET pre-market briefing.
    # Fire at 12:10 UTC (1h before market-hours GitHub rush at 13:30 UTC) so
    # the job runs quickly instead of sitting in queue for 2-4 hours.
    # EDT (Mar–Nov): 12:10 UTC = 8:10 AM ET / 6:10 AM MDT
    # EST (Nov–Mar): 12:10 UTC = 7:10 AM ET / 5:10 AM MST  ← acceptable early
    - cron: '10 12 * * 1-5'
  workflow_dispatch:   # manual trigger for testing

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: dman-premarket
  cancel-in-progress: false

jobs:
  premarket:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Run Pre-Market Briefing
        env:
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BENZINGA_API_KEY:  ${{ secrets.BENZINGA_API_KEY }}
          MASSIVE_API_KEY:          ${{ secrets.MASSIVE_API_KEY }}
          MASSIVE_NEWS_API_KEY:     ${{ secrets.MASSIVE_NEWS_API_KEY }}
          MASSIVE_EARNINGS_API_KEY: ${{ secrets.MASSIVE_EARNINGS_API_KEY }}
          BENZINGA_EARNING_API_KEY: ${{ secrets.BENZINGA_EARNING_API_KEY }}
          PYTHONIOENCODING:  utf-8
          EVENT_NAME:        ${{ github.event_name }}
        run: |
          python - <<'EOF'
          from datetime import datetime, timedelta
          import zoneinfo, sys, subprocess, time
          ET = zoneinfo.ZoneInfo("America/New_York")
          now = datetime.now(ET)
          if now.weekday() >= 5:
              print(f"Weekend ({now.strftime('%a')}) — skipping briefing.")
              sys.exit(0)
          # If GitHub ran this early (before 8:00 AM ET), wait up to 12 min.
          # If it's still before 7:30 AM ET after waiting, skip — GitHub is
          # running the job far too early (rare) and we'll catch it next time.
          target_hhmm = 800   # 8:00 AM ET
          cur_hhmm    = now.hour * 100 + now.minute
          if cur_hhmm < 730:
              print(f"Too early ({now.strftime('%H:%M ET')}) — GitHub ran job ahead of schedule. Skipping.")
              sys.exit(0)
          # GitHub's scheduler has been starting this job ~4 hours late every
          # day (12:21, 12:56, 12:49, 12:55 PM ET the week of 2026-09-14). The
          # scanner workflow dispatches the briefing at ~8:20 AM as a backstop,
          # and THAT is the briefing that arrives in time; the late scheduled
          # run then sent a second "pre-market" briefing hours after the open.
          # Scheduled runs only -- a manual dispatch always runs.
          import os
          if os.environ.get("EVENT_NAME") == "schedule" and cur_hhmm >= 925:
              print(f"Too late ({now.strftime('%H:%M ET')}) — GitHub delayed this past the open; "
                    "the 8:20 dispatch already delivered today's briefing. Skipping.")
              sys.exit(0)
          if cur_hhmm < target_hhmm:
              wait_s = (target_hhmm // 100 * 60 + target_hhmm % 100 - now.hour * 60 - now.minute) * 60
              wait_s = min(wait_s, 12 * 60)  # cap at 12 min (stay under step timeout)
              print(f"Waiting {wait_s}s for 8:00 AM ET...")
              time.sleep(wait_s)
          result = subprocess.run(
              [sys.executable, "dman_algo.py", "--mode", "premarket"],
              capture_output=False
          )
          sys.exit(result.returncode)
          EOF
