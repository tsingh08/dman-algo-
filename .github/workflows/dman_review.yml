name: DMan Session Review

# Post-close (and on-demand via /review on Telegram) review session — a
# real Claude Code agent, not more hand-written Python heuristics, reads
# the day's actual state (positions, P&L, recent trades, scan history)
# and the codebase itself, and reports what it finds: how the session
# went, anything that looks off heading into the next trading day, and
# specific code improvements it would recommend.
#
# Also runs at midday (added 2026-08-22, direct instruction) — same
# mechanism, same safety model, but with time-remaining-in-the-session
# framing instead of a post-mortem one, so real findings can be acted on
# same-day instead of only in hindsight after close. Which framing a run
# uses is decided by the actual ET time it executes at (the "Determine
# review kind" step below), not which trigger fired it — a manual /review
# at 11 AM gets the midday framing, at 6 PM gets the EOD one, regardless
# of source.
#
# The MIDDAY run stays REPORT ONLY, deliberately, by construction rather
# than just instruction — direct decision 2026-08-21 after the /review idea
# was raised, unchanged for midday: it never gets Edit/Write/git-commit
# tools at all, so even if it tried, there is nothing in its toolset capable
# of changing a file. No Alpaca credentials (APCA_API_KEY_ID/
# APCA_API_SECRET_KEY) are passed to this job at all, for either kind — the
# agent works from the git-tracked state files the daemon already keeps
# synced (dman_positions.json, dman_win_rate.json, dman_daily_pnl.json,
# dman_scan_log.json, dman_news_log.json), not a live broker session. It is
# structurally incapable of placing a real order here, not just told not to.
#
# The EOD run can propose real code changes as of 2026-08-24 (direct
# request) — but structurally as a PR, never a direct push to main, same
# "not just told not to" philosophy applied to the new capability instead of
# removed for it:
#   1. The "Create review branch" step below checks out a fresh branch
#      BEFORE Claude ever runs. The EOD invocation's --allowedTools includes
#      Edit/Write/git add/git commit, but deliberately NEVER git checkout,
#      git push, or gh — so even with contents: write at the job level, the
#      agent has no tool in its box capable of reaching origin or switching
#      back to main. It can only edit files and commit locally to the one
#      branch the workflow already put it on.
#   2. A SEPARATE step ("Push review branch and open PR") that runs after
#      Claude exits — plain shell script, not the agent — checks whether
#      any commits actually landed, and if so pushes THAT branch (git push
#      -u origin HEAD, never main) and opens a PR against main with gh pr
#      create. Nothing merges automatically; a human reviews the PR through
#      the same process every other change in this repo already goes
#      through. If Claude proposed nothing (the common case most nights),
#      no branch is ever pushed and no PR is opened.
#   2b. (2026-11-16, direct instruction, reversing the 11-09 "PR-only"
#      choice because the operator is away and nobody merges PRs.) The same
#      plain script may push the branch's commits to main INSTEAD of opening
#      a PR -- only when the "Auto-merge gate" step says every condition
#      holds: only the three code files touched, no existing test line
#      edited, a small diff, no module-level constant changed (checked by
#      main's own copy of tools/risk_pins_check.py), suite + goldens green.
#      The agent still has no push tool; the gate and the merge are shell.
#      After a merge the job dispatches ci.yml on main and reverts the
#      commits if it fails. Off switch: /flags automerge off.
#   3. main itself is never protected against direct pushes (the always-on
#      daemon depends on pushing its own state-sync commits straight to
#      main continuously through the trading day — branch-protecting main
#      would break that), so this guarantee lives entirely in what tools
#      the agent is handed, not in a GitHub-side restriction. Worth knowing
#      if this workflow is ever edited again: removing the branch-creation
#      step or widening --allowedTools to include git checkout/push/gh
#      undoes the structural guarantee, not just a stated preference.

on:
  schedule:
    # ~12:34 PM ET weekdays (16:34 UTC) — midday check, well clear of the
    # 9:45 AM Gap & Hold scan and the 10:34 AM-3:34 PM hourly momentum
    # scans' own :34 slots (offset to :34 like those, same GitHub-queue-
    # congestion reasoning as every other cron here).
    - cron: '34 16 * * 1-5'
    # Two more intraday check-ins (added 2026-11-16, direct instruction: the
    # operator is away from 11-17 and wants the system reviewed through the
    # session, not once). ~10:14 and ~14:40 ET on winter time; an hour later
    # on summer time, where the last one (15:40) falls after the 15:15
    # cut-off below and skips -- summer gets two check-ins unless this is
    # re-timed at the March clock change.
    # All three are silent on Telegram unless they find something that needs
    # a human -- see the "Post report" step.
    - cron: '14 15 * * 1-5'
    - cron: '40 19 * * 1-5'
    # ~4:20 PM ET weekdays (20:20 UTC) — after the 4:04 PM EOD P&L summary
    # and momentum-watch have both settled, so today's real close-of-day
    # state is fully synced before the review reads it. Offset from :00
    # for the same GitHub-queue-congestion reasoning every other cron in
    # this repo already uses (see dman_watchdog.yml's comment for the
    # confirmed-live incident behind that pattern).
    - cron: '24 20 * * 1-5'   # 4:24 PM EDT
    - cron: '24 21 * * 1-5'   # 4:24 PM EST (daylight saving ends Nov 1; the
                              # 20:24 cron is 3:24 PM then -- before the close.
                              # The kind step below runs only one of them.)
  workflow_dispatch:   # /review on Telegram dispatches this directly

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Only one review runs at a time — an on-demand /review firing seconds
# after the scheduled 4:20 PM run would otherwise race on the same repo
# state (harmless since both are read-only, but wastes a full session).
concurrency:
  group: dman-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    # 20 -> 25: the EOD run now also installs deps and runs the full suite
    # after the review session (which alone has measured up to ~8.5 min).
    # 25 -> 50: an auto-merged fix is followed by a CI run on main that this
    # job waits for (up to 15 min) so it can revert a red one.
    timeout-minutes: 50
    permissions:
      contents: write        # pushes the review/* branch, and -- only from the
                               # plain-shell merge step, never from the agent --
                               # a gate-passing fix to main (see "Auto-merge gate")
      pull-requests: write   # needed for the "open PR" step's `gh pr create`
      actions: write         # the kind step reads today's runs; the post-merge
                               # step dispatches ci.yml on main

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Determine review kind
        id: kind
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ET_HOUR=$(TZ="America/New_York" date +%H)
          # Same 10 AM-3 PM ET window as the prompt-selection logic below --
          # computed once here so the branch-creation step (EOD only) and
          # the review-session step agree on which kind this run is,
          # instead of recomputing (and risking drifting from) it twice.
          ET_HHMM=$(TZ="America/New_York" date +%H%M)
          # 10#: a leading zero ("0945") must not be read as octal.
          # 15:15, not 15:00: the 19:40 UTC check-in is 14:40 ET in winter and
          # must run; the summer EOD cron (20:24 UTC) is 15:24 ET in winter
          # and must still skip.
          if [ "$((10#$ET_HHMM))" -ge 1000 ] && [ "$((10#$ET_HHMM))" -lt 1515 ]; then
            # The daemon now dispatches the check-ins on the clock (10:15,
            # 12:35, 14:40 ET -- dman_daemon.py _dispatch_due_review), because
            # on 2026-11-16 GitHub delivered all three of these crons after
            # the close. A cron that does turn up inside the session is only
            # a fallback: it skips when another review started within the
            # last 75 minutes. A dispatch (the daemon's, or /review) always runs.
            RECENT=""
            if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
              SINCE=$(date -u -d '75 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
              RECENT=$(gh run list -R "$GITHUB_REPOSITORY" --workflow dman_review.yml --limit 10 \
                         --json databaseId,createdAt \
                         -q ".[] | select(.createdAt >= \"$SINCE\" and (.databaseId|tostring) != \"$GITHUB_RUN_ID\") | .databaseId" \
                         2>/dev/null | head -1)
            fi
            if [ -n "$RECENT" ]; then
              echo "A review started within the last 75 min (run $RECENT) -- skipping this cron."
              echo "kind=skip" >> "$GITHUB_OUTPUT"
            else
              echo "kind=midday" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$((10#$ET_HHMM))" -ge 1605 ]; then
            # Any time after the close counts, not just 16:05-17:00. GitHub
            # starts these crons up to 3.5h late: on 10-20 and 10-23 every
            # run landed at 16:00-16:04 or after 19:00 ET and NO EOD review
            # ran at all (1 of the 4 sessions 10-20..23 got one). So the
            # first run after the close does the review and later late
            # crons skip -- a /review dispatch always runs.
            DONE=""
            if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
              CUTOFF=$(date -u -d @"$(TZ="America/New_York" date -d '16:00' +%s)" +%Y-%m-%dT%H:%M:%SZ)
              for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow dman_review.yml --limit 20 \
                            --json databaseId,createdAt \
                            -q ".[] | select(.createdAt >= \"$CUTOFF\") | .databaseId"); do
                [ "$id" = "$GITHUB_RUN_ID" ] && continue
                c=$(gh run view "$id" -R "$GITHUB_REPOSITORY" --json jobs \
                      -q '.jobs[].steps[] | select(.name == "Create review branch") | .conclusion' 2>/dev/null)
                [ "$c" = "success" ] && DONE="$id"
              done
            fi
            if [ -n "$DONE" ]; then
              echo "EOD review already ran today (run $DONE) -- skipping."
              echo "kind=skip" >> "$GITHUB_OUTPUT"
            else
              echo "kind=eod" >> "$GITHUB_OUTPUT"
            fi
          else
            # Before the close or long after it: the other cron owns this clock.
            echo "kind=skip" >> "$GITHUB_OUTPUT"
          fi

      - name: Create review branch
        if: steps.kind.outputs.kind == 'eod'
        id: branch
        run: |
          BRANCH="review/$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "dman-review-bot"
          git config user.email "dman-review-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run review session
        # 'skip' = this cron's clock is wrong for the season; the sibling cron
        # owns the run. Without this the job would still burn a review session
        # and post a report at 3:24 PM, before the close.
        if: steps.kind.outputs.kind != 'skip'
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KIND: ${{ steps.kind.outputs.kind }}
        run: |
          SHARED_CONTEXT='You are checking in on a live-money algorithmic
          trading system in this repo. You have NO live broker credentials
          -- work entirely from the git-tracked state files and codebase.

          Look at: dman_positions.json (currently open positions),
          dman_win_rate.json (recent trade outcomes), dman_daily_pnl.json /
          dman_monthly_pnl.json (realized P&L), dman_scan_log.json (recent
          scan activity), dman_news_log.json (recent headlines), dman_halt.json
          and dman_probation.json if present (current risk-control state),
          and recent git log / diffs for anything that changed today. Cross-
          reference against dman_algo.py and dman_daemon.py as needed to
          understand what a given state actually means.

          If you are not sure whether something needs a human decision, say
          so explicitly rather than assuming an answer.

          Keep your FINAL reply under 3500 characters -- it is posted
          directly to a phone via Telegram. Use plain text, no markdown
          tables.'

          if [ "$KIND" = "midday" ]; then
            ALLOWED_TOOLS="Bash(python dman_algo.py --mode features),Read,Grep,Glob,Bash(git log:*),Bash(git diff:*),Bash(git show:*)"
            PROMPT="$SHARED_CONTEXT"'

          You have READ-ONLY repo access this run -- report only, the same
          as always for a midday check.

          It is currently mid-session -- the market is open and there is
          real time left today to act on what you find. Produce a concise,
          ACTIONABLE check-in covering:
          1. What has happened so far today -- anything closed, anything
             new opened, current realized P&L, current open risk exposure.
          2. Anything that needs attention THIS AFTERNOON specifically --
             a position nearing its stop/target, a circuit breaker state
             that changes what can still be entered today, a scan that
             silently failed this morning.
          3. What is worth watching for the rest of today -- an upcoming
             scheduled event later today or tomorrow morning that changes
             risk (from dman_algo.py'"'"'s own macro-event calendars:
             _FOMC_DATES, _CPI_DATES, _PPI_DATES, _PCE_DATES,
             _MAJOR_MACRO_EVENT_DATES, earnings dates on open positions),
             or a setup/sector that has looked notably strong or weak in
             today'"'"'s scan log so far.

          Do not spend much space on code recommendations here -- that is
          what the end-of-day review is for. Only mention one if it is
          urgent enough to matter before tomorrow.

          The operator is away and reads Telegram rarely. The FIRST LINE of
          your reply must be exactly one of:
            STATUS: OK
            STATUS: ATTENTION
          Use ATTENTION only when a human should act or know TODAY: a
          position with no stop, state files that contradict each other, a
          scan or the daemon that has silently stopped, a halt or breaker in
          a state the day does not explain, an error repeating in the logs.
          A quiet day with no signals and no trades is STATUS: OK -- that is
          the normal day here. An OK report is filed in the run log and NOT
          sent to the phone, so do not pad it.'
          else
            # EOD only, added 2026-08-24: real Edit/Write/local-commit
            # access, deliberately still missing git checkout/push/gh --
            # see the file header for why that specific gap is what keeps
            # this PR-only rather than main-reachable. Already on a fresh
            # review/* branch from the "Create review branch" step above.
            ALLOWED_TOOLS="Bash(python dman_algo.py --mode features),Read,Grep,Glob,Edit,Write,Bash(git add:*),Bash(git commit:*),Bash(git status:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"
            PROMPT="$SHARED_CONTEXT"'

          You ALSO have Edit/Write access and can make real code changes
          this run, already checked out on a fresh branch off main. If you
          find something genuinely worth fixing -- not everything has to
          be, most nights nothing will be -- make the change and commit it
          locally (git add + git commit; you do not have git push or gh,
          a separate step handles turning your commit(s) into a PR against
          main if you make any). Prioritize small, well-verified,
          low-risk fixes over ambitious rewrites: this runs unattended
          overnight, no human is watching it work, and whatever you commit
          becomes a real PR someone reviews tomorrow -- favor a fix you
          are genuinely confident in over one that merely looks plausible.
          If you are not confident a change is correct, describe it in
          your report instead of committing something shaky. Never edit
          .github/workflows/dman_review.yml itself (this file) -- a
          change to the workflow that runs you should go through a normal
          human-initiated session, not this one.

          You are reviewing the just-closed (or most recent) trading
          session. Produce a concise report covering:
          1. How the session actually went -- realized P&L, what closed, what
             is still open and its current risk exposure.
          2. Anything that looks off, risky, or worth flagging before the
             next trading day -- stale/inconsistent state, a setup with a
             notably bad recent record, a circuit breaker in an unexpected
             state, anything that would surprise a human reviewing it fresh.
          3. Specific, concrete code improvements you would recommend -- name
             the file/function, describe the change, and why. Do not just
             gesture at "the code could be cleaner" -- be specific enough that
             someone could hand this straight to a follow-up session to
             implement. Say clearly whether you already committed each one
             or are only describing it.

          Also run `python dman_algo.py --mode features` and quote its
          "exit capture" / "round-tripped" / "exits:" lines verbatim in your
          report, with one sentence on whether they moved. Added 2026-10-06:
          that report is the ONLY place the exit-capture metric surfaces, and
          until now its single caller printed it to a runner log nobody reads
          -- the same stdout-only blind spot that hid the heat cap for a whole
          session. The numbers at the time: mean MFE +4.68% vs P/L -3.23%
          (-69% capture), 2 of 50 signals ever reaching target. If capture
          improves toward 0 or the target count rises, say so; that is
          currently the largest known lever on performance and nothing else
          watches it.

          That same report now ends with an "AI scorer" line: how the signals
          the live AI veto would pass have done against the ones it would
          block. Quote it verbatim. If it carries the warning that the veto
          is not earning its keep, say so at the top of your report.

          HOW YOUR COMMITS REACH MAIN (changed 2026-11-16: the operator is
          away and nobody is merging PRs). After you exit, a plain script --
          not you -- decides. Your branch is merged to main automatically
          ONLY if every one of these holds; otherwise it becomes a PR that
          may wait weeks:
            - it changes only dman_algo.py, dman_daemon.py, test_dman_algo.py
            - it adds tests but does not edit or delete a single existing
              line of test_dman_algo.py
            - the code change is at most 120 lines added+removed
            - no module-level UPPER_CASE constant is changed or removed
              (every risk limit, flag, watchlist and calendar is one)
            - the full suite and the five golden harnesses pass unchanged
          So: a genuine bug fix with a new test that fails before it and
          passes after is the kind of change that ships tonight. Anything
          that changes how much is risked, what may trade, a threshold, a
          calendar or a golden is a strategy decision -- write it up in the
          report and, if you commit it, expect it to wait as a PR. Never
          work around a gate (for example by moving a limit out of a
          constant, or by weakening behaviour a test or golden pins): a
          merged fix that fails CI on main is reverted automatically and
          reported to the operator as such. One focused fix per night beats
          several; if nothing is clearly broken, commit nothing.

          Prioritize the most important 3-5 findings over an exhaustive
          list.'
          fi

          set +e
          OUTPUT=$(claude -p "$PROMPT" \
            --model claude-fable-5 \
            --dangerously-skip-permissions \
            --allowedTools "$ALLOWED_TOOLS" \
            2>&1)
          STATUS=$?
          set -e

          echo "review_kind=$KIND" >> "$GITHUB_OUTPUT"

          echo "exit_status=$STATUS" >> "$GITHUB_OUTPUT"

          # Telegram's hard cap is 4096 chars -- truncate defensively even
          # though the prompt already asks for <3500.
          TRUNCATED=$(echo "$OUTPUT" | cut -c1-3900)
          {
            echo "review_output<<REVIEW_EOF"
            echo "$TRUNCATED"
            echo "REVIEW_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python for branch validation
        if: steps.kind.outputs.kind == 'eod'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Validate review branch
        # A PR opened with GITHUB_TOKEN never dispatches workflow runs --
        # that's GitHub's Actions loop-prevention rule, not a config error.
        # Confirmed live 2026-09-03: the CI run for PR #1 (33705075129) was
        # created the instant the PR opened, sat with ZERO jobs and zero
        # check-runs for 55 minutes, then flipped to "failure" the moment the
        # PR merged. So ci.yml does NOT and cannot gate review PRs, and the
        # review agent's commits were reaching main with no automated check
        # at all. Switching to a PAT would fix the trigger but needs a new
        # long-lived secret with write scope; running the same gates here,
        # on the branch, before the PR exists, needs none and catches a
        # breakage strictly earlier. Never fails the job -- a broken branch
        # must still surface as a loudly-labelled PR, not a silent no-PR.
        if: steps.kind.outputs.kind == 'eod'
        id: validate
        env:
          PYTHONIOENCODING: utf-8
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          # GitHub runs `run:` blocks as `bash -e`, so set +e FIRST and keep it
          # off for the whole step. Anything that exits non-zero here (a pip
          # mirror blip, a grep with no match) would otherwise kill the step,
          # and because the PR step carries a plain `if:` its implicit
          # success() would then skip it -- losing the review branch's PR
          # entirely over an infrastructure hiccup. A gate that can silently
          # suppress the PR is worse than no gate. This step always exits 0;
          # a real problem is reported through `verdict`, never through
          # the step's status.
          set +e

          COMMIT_COUNT=$(git rev-list --count origin/main.."$BRANCH" 2>/dev/null || echo 0)
          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "  No commits on $BRANCH -- nothing to validate."
            echo "verdict=skipped" >> "$GITHUB_OUTPUT"
            echo "detail=no commits to validate" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python -m pip install --upgrade pip >/dev/null 2>&1
          pip install -r requirements.txt >/dev/null 2>&1
          PIP_STATUS=$?

          FAILED=""
          # Without deps the three python gates below would all fail and read
          # as "the branch is broken" when nothing is wrong with the branch.
          [ $PIP_STATUS -eq 0 ] || FAILED="${FAILED}deps "

          python -m py_compile dman_algo.py dman_daemon.py test_dman_algo.py
          [ $? -eq 0 ] || FAILED="${FAILED}syntax "

          python -c "import dman_algo" >/dev/null
          [ $? -eq 0 ] || FAILED="${FAILED}import "

          python -m unittest test_dman_algo > /tmp/review_tests.log 2>&1
          TEST_STATUS=$?
          [ $TEST_STATUS -eq 0 ] || FAILED="${FAILED}tests "

          # The review agent edits the tracked state JSONs more often than it
          # edits code, so this mirror of ci.yml's JSON gate is the single
          # most load-bearing check here: a malformed dman_*.json merged to
          # main takes down every scheduled trading job at once.
          python - <<'PYEOF'
          import json, glob, sys
          bad = []
          for p in glob.glob("dman_*.json"):
              try:
                  with open(p, encoding="utf-8") as f:
                      json.load(f)
              except Exception as e:
                  bad.append(f"{p}: {e}")
          if bad:
              print("INVALID JSON:\n" + "\n".join(bad))
              sys.exit(1)
          print(f"All {len(glob.glob('dman_*.json'))} JSON data files valid")
          PYEOF
          [ $? -eq 0 ] || FAILED="${FAILED}json "

          # "Ran N tests in Xs" / "OK" / "FAILED (failures=..)" -- the only
          # lines worth carrying into the PR body and Telegram. grep exits 1
          # when the suite died before printing a summary; keep set -e off
          # (see top of step) and fall back rather than killing the step.
          RAN=$(grep -E '^(Ran |OK|FAILED)' /tmp/review_tests.log 2>/dev/null | tr '\n' ' ' | cut -c1-200)
          [ -n "$RAN" ] || RAN="(no test summary -- suite did not complete)"
          echo "  Test result: $RAN"

          # The suite writes to the tracked state JSONs (dman_last_alerts.json
          # and the feed-state files) as a side effect. Those writes are test
          # pollution, not review findings -- drop them so nothing downstream
          # mistakes them for the agent's work.
          git checkout -- . 2>/dev/null || true

          if [ -n "$FAILED" ]; then
            echo "verdict=fail" >> "$GITHUB_OUTPUT"
            echo "detail=failed gate(s): ${FAILED}| $RAN" >> "$GITHUB_OUTPUT"
            echo "  VALIDATION FAILED: $FAILED"
            tail -30 /tmp/review_tests.log 2>/dev/null
          else
            echo "verdict=pass" >> "$GITHUB_OUTPUT"
            echo "detail=$RAN" >> "$GITHUB_OUTPUT"
            echo "  Validation passed."
          fi

          # Explicit: the step's status must never be what reports a finding.
          exit 0

      - name: Auto-merge gate
        # Decides whether tonight's commits may go straight to main. Every
        # input it trusts comes from origin/main, not from the branch: the
        # off switch, the constant checker, and the "before" copies of the
        # code. Never fails the job; anything unexpected means "not eligible".
        if: steps.kind.outputs.kind == 'eod' && steps.validate.outputs.verdict == 'pass'
        id: gate
        env:
          PYTHONIOENCODING: utf-8
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set +e
          REASONS=""
          no() { REASONS="${REASONS}$1; "; }

          ON=$(git show origin/main:dman_flags.json 2>/dev/null | python -c "import json,sys; print(json.load(sys.stdin).get('ENABLE_REVIEW_AUTOMERGE', True))" 2>/dev/null)
          [ "$ON" = "True" ] || no "auto-merge is switched off (or the flag file could not be read)"

          for f in $(git diff --name-only origin/main "$BRANCH"); do
            case "$f" in
              dman_algo.py|dman_daemon.py|test_dman_algo.py) ;;
              *) no "touches $f" ;;
            esac
          done

          DEL=$(git diff --numstat origin/main "$BRANCH" -- test_dman_algo.py | awk '{s+=$2} END{print s+0}')
          [ "$DEL" -eq 0 ] || no "edits or removes $DEL existing test line(s)"

          CHURN=$(git diff --numstat origin/main "$BRANCH" -- dman_algo.py dman_daemon.py | awk '{s+=$1+$2} END{print s+0}')
          [ "$CHURN" -le 120 ] || no "code diff is $CHURN lines (limit 120)"

          mkdir -p /tmp/pins
          git show origin/main:tools/risk_pins_check.py > /tmp/pins/check.py 2>/dev/null
          git show origin/main:dman_algo.py   > /tmp/pins/algo_main.py   2>/dev/null
          git show origin/main:dman_daemon.py > /tmp/pins/daemon_main.py 2>/dev/null
          python /tmp/pins/check.py /tmp/pins/algo_main.py dman_algo.py \
                                    /tmp/pins/daemon_main.py dman_daemon.py > /tmp/pins/out.txt 2>&1
          [ $? -eq 0 ] || no "$(head -4 /tmp/pins/out.txt | tr '\n' ' ' | cut -c1-200)"

          # The same five harnesses ci.yml runs; they pin the order and exit paths.
          G=0
          python golden/submit_signals_harness.py check       2>&1 | grep -q "GOLDEN: IDENTICAL" || G=1
          python golden/monitor_option_harness.py check       2>&1 | grep -q "GOLDEN: IDENTICAL" || G=1
          python golden/callee_harness.py telegram check      2>&1 | grep -q "GOLDEN: IDENTICAL" || G=1
          python golden/scanner_harness.py check              2>&1 | grep -q "GOLDEN: IDENTICAL" || G=1
          python golden/premarket_briefing_harness.py check   2>&1 | grep -q "GOLDEN: IDENTICAL" || G=1
          [ "$G" -eq 0 ] || no "a golden harness changed"
          git checkout -- . 2>/dev/null || true

          if [ -z "$REASONS" ]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "  Auto-merge gate: ELIGIBLE"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "reasons=$(echo "$REASONS" | tr -d '\r\n' | cut -c1-400)" >> "$GITHUB_OUTPUT"
            echo "  Auto-merge gate: not eligible -- $REASONS"
          fi
          exit 0

      - name: Push review branch and open PR
        # EOD only. Deliberately a plain script, not the agent -- see the
        # file header. Runs even if the review step's OWN exit code was
        # non-zero (set +e above keeps the job itself green regardless),
        # since a real commit can still be sitting on the branch even if
        # Claude hit an error after making it; only skip if there's
        # nothing to push.
        # always() so no upstream step failure can silently swallow the PR --
        # a plain `if:` carries an implicit success(), which would skip this
        # step (and lose the branch's work) the moment anything above it went
        # red. Guarded below by COMMIT_COUNT, which exits cleanly when the
        # branch step never ran.
        if: always() && steps.kind.outputs.kind == 'eod'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          VERDICT: ${{ steps.validate.outputs.verdict }}
          VDETAIL: ${{ steps.validate.outputs.detail }}
          ELIGIBLE: ${{ steps.gate.outputs.eligible }}
        run: |
          COMMIT_COUNT=$(git rev-list --count origin/main.."$BRANCH" 2>/dev/null || echo 0)
          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "  No commits on $BRANCH -- nothing to push, no PR."
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Gate passed: put the commits on main instead of opening a PR.
          # Rebased onto whatever main is NOW (the evening daemon keeps
          # pushing state commits), re-compiled, pushed; up to 3 tries. Any
          # failure falls through to the PR path below, so the work is never
          # lost and never half-applied.
          if [ "$ELIGIBLE" = "true" ]; then
            set +e
            SUBJECTS=$(git log --format='%s' origin/main.."$BRANCH" | head -5 | tr '\n' '|' | cut -c1-300)
            merged=0
            for attempt in 1 2 3; do
              git fetch origin main || continue
              if ! git rebase origin/main; then git rebase --abort; break; fi
              python -m py_compile dman_algo.py dman_daemon.py test_dman_algo.py || break
              BEFORE=$(git rev-parse origin/main)
              if git push origin HEAD:main; then merged=1; break; fi
              echo "  push to main rejected (attempt $attempt/3) -- refetching"
            done
            set -e
            if [ "$merged" = 1 ]; then
              echo "  Auto-merged $COMMIT_COUNT commit(s) to main: $SUBJECTS"
              {
                echo "pr_url="
                echo "merged=true"
                echo "merged_before=$BEFORE"
                echo "merged_after=$(git rev-parse HEAD)"
                echo "merged_subjects=$SUBJECTS"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "  Auto-merge could not complete -- opening a PR instead."
          fi

          # GITHUB_TOKEN-opened PRs get no CI run (see the validate step), so
          # this line is the ONLY automated verdict a reviewer will ever see
          # on this PR. Say it in the title too -- a red-flagged branch must
          # not look identical to a clean one in the PR list.
          if [ "$VERDICT" = "pass" ]; then
            TITLE="DMan review: $(date -u +%Y-%m-%d) findings"
            CHECK="✅ Branch validation PASSED (syntax + import + full suite): $VDETAIL"
          elif [ "$VERDICT" = "fail" ]; then
            TITLE="⛔ NEEDS FIX — DMan review: $(date -u +%Y-%m-%d) findings"
            CHECK="⛔ Branch validation FAILED — $VDETAIL

          DO NOT MERGE until this is green. These commits were written by the
          automated review session and have NOT passed the standard gates."
          else
            TITLE="DMan review: $(date -u +%Y-%m-%d) findings"
            CHECK="⚠️ Branch validation did not run ($VERDICT) -- verify manually before merging."
          fi

          git push -u origin HEAD
          PR_URL=$(gh pr create \
            --title "$TITLE" \
            --body "Opened automatically by the after-close /review session. $COMMIT_COUNT commit(s) on this branch -- see the Telegram report from the same run for the full writeup, and the commits themselves for what actually changed. Nothing here has been merged; review before merging, same as any other PR.

          $CHECK

          Note: GitHub does not run CI on PRs opened by Actions' own token, so the check above (run on this branch before the PR was opened) replaces it." \
            --base main --head "$BRANCH")
          echo "  PR opened: $PR_URL"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Verify main after auto-merge (revert on red)
        # A push made with the workflow's own token starts no CI run (GitHub's
        # loop-prevention rule), so the merged commits would otherwise sit on
        # main checked only by the branch run above. workflow_dispatch IS
        # allowed from that token: run ci.yml on main, wait for it, and take
        # the commits back out if it fails. A red or unknown result never
        # leaves an unverified change live without saying so.
        if: always() && steps.pr.outputs.merged == 'true'
        id: postci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ steps.pr.outputs.merged_before }}
          AFTER:  ${{ steps.pr.outputs.merged_after }}
        run: |
          set +e
          START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if ! gh workflow run ci.yml --ref main -R "$GITHUB_REPOSITORY"; then
            echo "result=ci-not-started" >> "$GITHUB_OUTPUT"; exit 0
          fi
          RID=""
          for i in 1 2 3 4 5 6; do
            sleep 10
            RID=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --event workflow_dispatch --limit 5 \
                    --json databaseId,createdAt -q "[.[] | select(.createdAt >= \"$START\")][0].databaseId")
            [ -n "$RID" ] && break
          done
          if [ -z "$RID" ]; then echo "result=ci-not-started" >> "$GITHUB_OUTPUT"; exit 0; fi
          timeout 900 gh run watch "$RID" -R "$GITHUB_REPOSITORY" --interval 20 > /dev/null 2>&1
          CONC=$(gh run view "$RID" -R "$GITHUB_REPOSITORY" --json conclusion -q .conclusion)
          echo "  CI run $RID on main: ${CONC:-unfinished}"
          if [ "$CONC" = "success" ]; then
            echo "result=green" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$CONC" != "failure" ]; then
            echo "result=ci-${CONC:-unfinished}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Red: revert exactly the merged commits, newest first, on top of
          # whatever main is now. They touch code files only, so the state
          # commits pushed since cannot conflict with the revert.
          reverted=0
          for attempt in 1 2 3; do
            git fetch origin main || continue
            git checkout -q -B automerge-revert origin/main || continue
            if ! git revert --no-edit "$BEFORE..$AFTER"; then git revert --abort; break; fi
            if git push origin HEAD:main; then reverted=1; break; fi
          done
          if [ "$reverted" = 1 ]; then
            echo "result=reverted" >> "$GITHUB_OUTPUT"
          else
            echo "result=revert-failed" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Post report to Telegram
        if: always() && steps.kind.outputs.kind != 'skip'
        env:
          REVIEW_OUTPUT: ${{ steps.review.outputs.review_output }}
          REVIEW_STATUS: ${{ steps.review.outputs.exit_status }}
          REVIEW_KIND:   ${{ steps.review.outputs.review_kind }}
          PR_URL:        ${{ steps.pr.outputs.pr_url }}
          PR_VERDICT:    ${{ steps.validate.outputs.verdict }}
          PR_VDETAIL:    ${{ steps.validate.outputs.detail }}
          GATE_REASONS:  ${{ steps.gate.outputs.reasons }}
          MERGED:        ${{ steps.pr.outputs.merged }}
          MERGED_SUBJ:   ${{ steps.pr.outputs.merged_subjects }}
          POSTCI:        ${{ steps.postci.outputs.result }}
          RUN_URL:       ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'EOF'
          import os, html, urllib.parse, urllib.request
          token  = os.environ["TELEGRAM_TOKEN"]
          chat   = os.environ["TELEGRAM_CHAT_ID"]
          status = os.environ.get("REVIEW_STATUS", "1")
          kind   = os.environ.get("REVIEW_KIND", "eod")
          pr_url = os.environ.get("PR_URL", "").strip()
          label  = "midday check-in" if kind == "midday" else "session review"
          header = (f"🔎 <b>DMan {label}</b>" if status == "0" else
                     f"⚠️ <b>DMan {label} — the run itself hit an error, showing what it captured</b>")
          body = os.environ.get("REVIEW_OUTPUT", "").strip() or "(no output captured)"
          # Intraday check-ins are silent unless they ask for attention
          # (operator away from 2026-11-17; "fewer Telegram messages"). The
          # report is still in this run's log. Anything other than a clean
          # run that opens with STATUS: OK is sent -- including a reply that
          # forgot the status line, so a format slip cannot hide a problem.
          if kind == "midday" and status == "0" and body.upper().startswith("STATUS: OK"):
              print("Intraday check-in: STATUS OK -- not sent to Telegram.\n")
              print(body)
              raise SystemExit(0)
          # Confirmed live 2026-09-02: a real Anthropic account credit
          # exhaustion surfaces here as the bare CLI error string with zero
          # context -- technically "sent to Telegram" but genuinely
          # confusing (just "Credit balance is too low", no explanation of
          # what's low on credits or what to do about it). This is a
          # billing action only the account owner can take (add funds at
          # console.anthropic.com) -- no code fix restores it -- so the
          # one thing worth improving here is making the alert say that
          # plainly instead of relaying the raw error.
          if "credit balance is too low" in body.lower():
              header = "💳 <b>DMan session review unavailable — Anthropic API credits exhausted</b>"
              body = (
                  "The ANTHROPIC_API_KEY used for session reviews (and the live scanner's "
                  "AI-scoring step) is out of credits.\n\n"
                  "Fix: add funds at console.anthropic.com for the account that owns this key, "
                  "then session reviews resume automatically -- no code change needed.\n\n"
                  "Does NOT affect live trading: AI-scoring fails OPEN by design (falls back to "
                  "confluence-only scoring, never blocks a trade) -- confirmed no live scan hit "
                  "this today."
              )
          footer = ""
          if kind == "eod" and os.environ.get("MERGED", "") == "true":
              subj = html.escape(os.environ.get("MERGED_SUBJ", "").strip("|").replace("|", "; "))
              postci = os.environ.get("POSTCI", "").strip()
              if postci == "green":
                  footer += f"\n\n✅ <b>Fix merged to main automatically</b> (all gates + CI on main green): {subj}"
              elif postci == "reverted":
                  footer += (f"\n\n⛔ <b>Auto-merged fix FAILED CI on main and was REVERTED</b> — "
                             f"main is back to the previous code: {subj}")
              elif postci == "revert-failed":
                  footer += (f"\n\n🚨 <b>Auto-merged fix FAILED CI on main and the revert did NOT go "
                             f"through — main needs a human</b>: {subj}")
              else:
                  footer += (f"\n\n⚠️ <b>Fix merged to main automatically</b>, but the follow-up CI run "
                             f"on main did not report ({html.escape(postci or 'no result')}): {subj}")
          elif kind == "eod" and pr_url and os.environ.get("GATE_REASONS", "").strip():
              footer += ("\n\n📝 <b>Kept as a PR, not auto-merged</b> — "
                         + html.escape(os.environ.get("GATE_REASONS", "").strip()))
          if kind == "eod" and pr_url:
              footer += f"\n\n📤 <b>PR opened:</b> {html.escape(pr_url)}"
              # GitHub runs no CI on an Actions-token PR, so this branch
              # validation is the only gate -- report it here rather than
              # leaving it only in the PR body nobody opens on a phone.
              verdict = os.environ.get("PR_VERDICT", "").strip()
              detail  = html.escape(os.environ.get("PR_VDETAIL", "").strip())
              if verdict == "pass":
                  footer += f"\n✅ <b>Branch checks passed</b> — {detail}"
              elif verdict == "fail":
                  footer += (f"\n⛔ <b>Branch checks FAILED — do not merge</b> — {detail}")
              elif verdict:
                  footer += f"\n⚠️ <b>Branch checks {html.escape(verdict)}</b> — {detail}"
          # Standard library only. This step runs `if: always()`, but the only
          # `pip install` in the job lives inside the conditional validation
          # step, with its output sent to /dev/null -- so on 2026-09-11 the
          # step died with "No module named 'requests'" and the review never
          # reached Telegram, replaced by a generic "pre-run step failed"
          # alert that pointed at the wrong step. A report step that can only
          # run when some other step happened to install a package is not a
          # report step you can rely on.
          #
          # Telegram rejects any message over 4096 characters with HTTP 400,
          # and nothing here limited the length: the 11-03 and 11-05 EOD
          # reviews both ran, opened their PRs, and then never reached the
          # phone. So the body goes out in chunks of at most CHUNK raw
          # characters, split on line breaks and escaped AFTER splitting
          # (an entity is never cut in half), capped at MAX_PARTS messages
          # with a pointer to the run log for the rest. A 400 on a part is
          # retried once as plain text, so a markup quirk cannot lose it.
          import re, urllib.error
          CHUNK, MAX_PARTS = 3300, 4
          run_url = os.environ.get("RUN_URL", "")
          # Lengths are measured AFTER escaping ("&" -> "&amp;" is 5x), and an
          # over-long line is cut into 600-char pieces first, so no piece can
          # escape past CHUNK on its own.
          esc = lambda s: len(html.escape(s))
          lines, parts, cur = [], [], ""
          for ln in body.splitlines(keepends=True):
              lines.extend([ln[i:i + 600] for i in range(0, len(ln), 600)] or [ln])
          for ln in lines:
              if cur and esc(cur + ln) > CHUNK:
                  parts.append(cur); cur = ""
              cur += ln
          if cur or not parts:
              parts.append(cur)
          truncated = len(parts) > MAX_PARTS
          parts = parts[:MAX_PARTS]

          def send(msg):
              def post(payload):
                  urllib.request.urlopen(urllib.request.Request(
                      f"https://api.telegram.org/bot{token}/sendMessage",
                      data=urllib.parse.urlencode(payload).encode()), timeout=15)
              try:
                  post({"chat_id": chat, "text": msg, "parse_mode": "HTML"})
              except urllib.error.HTTPError as e:
                  if e.code != 400:
                      raise
                  plain = html.unescape(re.sub(r"<[^>]+>", "", msg))[:4000]
                  post({"chat_id": chat, "text": plain})

          n = len(parts)
          for i, part in enumerate(parts):
              msg = (header if i == 0 else f"🔎 <b>(part {i + 1}/{n})</b>") + "\n\n" + html.escape(part)
              if i == n - 1:
                  if truncated:
                      msg += f"\n\n… <i>truncated — full report in the run log</i> {html.escape(run_url)}"
                  msg += footer
              send(msg)
          EOF

      - name: Notify on workflow failure
        if: failure()
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=⚠️ <b>DMan review FAILED</b> — a workflow step failed (not necessarily the review itself): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "parse_mode=HTML" || true
